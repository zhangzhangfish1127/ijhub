<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>物体的浮沉条件 · 初中科学动态实验室</title>
<link rel="icon" type="image/png" href="../shared/new-icon.png">
<link rel="stylesheet" href="../shared/style.css">
<style>
  .lab-side select {
    width: 100%; padding: 6px 8px; margin-top: 4px; font-size: 13px;
    border: 1px solid #ccc; border-radius: 6px; background: #fff; color: #2c3e50;
  }
  .lab-side .sub { font-size: 13px; color: #666; margin: 0 0 6px; }
  .lab-side .val { color: #e74c3c; font-weight: 600; }
  .lab-side .row label { margin: 0; }
  .case-table td:first-child { width: 34px; text-align: center; }
  .case-table td:nth-child(2) { white-space: nowrap; }
  .readout .hl { color: #e74c3c; font-weight: 700; }
  .readout .ok { color: #27ae60; font-weight: 700; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:12px; font-weight:700; color:#fff; }
</style>
</head>
<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>物体的浮沉条件</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>情况</th><th>条件</th><th>现象</th></tr></thead>
    <tbody>
      <tr data-case="1"><td>1</td><td>ρ物 &lt; ρ液</td><td>上浮至漂浮，F浮 = G</td></tr>
      <tr data-case="2"><td>2</td><td>ρ物 = ρ液</td><td>悬浮在液体中任意位置</td></tr>
      <tr data-case="3"><td>3</td><td>ρ物 &gt; ρ液</td><td>下沉到底：F浮 + N = G</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>物体密度 ρ物 = <span class="val" id="robVal">1.03</span> g/cm³
    <input id="robRange" type="range" min="0.2" max="2.5" step="0.01" value="1.03">
  </label>

  <label>物体预设
    <select id="objSel">
      <option value="0.60">木块（0.60）</option>
      <option value="0.90">塑料（0.90）</option>
      <option value="1.03" selected>鸡蛋（1.03）</option>
      <option value="2.20">石块（2.20）</option>
    </select>
  </label>

  <label>液体密度 ρ液 = <span class="val" id="rliqVal">1.00</span> g/cm³
    <input id="rliqRange" type="range" min="0.90" max="1.40" step="0.01" value="1.00">
  </label>

  <div class="row"><input type="checkbox" id="showForce" checked><label for="showForce" style="margin:0">显示受力箭头</label></div>
  <div class="row"><input type="checkbox" id="showSalt" checked><label for="showSalt" style="margin:0">显示盐水浓度条</label></div>

  <hr style="border:none; border-top:1px solid #eee; margin:12px 0">

  <p class="sub">演示</p>
  <button id="playBtn">▶ 自动加盐</button>
  <button class="secondary" id="resetBtn">↺ 重置</button>

  <div class="readout" id="readout"></div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
    <div class="legend">
      <span id="lgObj">物体</span>
      <span id="lgLiq">盐水</span>
      <span id="lgFb">浮力 F浮</span>
    </div>
    <div class="hint">拖动右侧盐度条加盐 / 加水，观察鸡蛋由沉到浮</div>
  </div>
</main>
</div>

<div class="site-footer">
  作者：zhangzhangfish ·
  <a href="../about.html">简介</a> ·

</div>

<script src="../shared/common.js"></script>
<script>
(function(){
  App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var W = 0, H = 0;

  var G_ACC = 9.8;
  var VOL = 60;              // 物体体积 cm³

  var rhoObj = 1.03;
  var rhoLiq = 1.00;
  var showForce = true;
  var showSalt = true;

  var curX = null, curY = null;     // 物体当前位置（像素）
  var curTilt = 0;
  var bubbles = [];
  var lastCase = '1';
  var playing = false;
  var playDir = 1;
  var rafId = null;
  var lastT = 0;
  var dragSalt = false;

  function themeName() { return App.getThemeName ? App.getThemeName() : 'normal'; }
  function gray() { return themeName() === 'achromatopsia'; }

  function fit() {
    var dpr = window.devicePixelRatio || 1;
    var rect = canvas.getBoundingClientRect();
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = rect.width;
    H = rect.height;
  }

  function layout() {
    var beaker = {
      x: W * 0.16, y: H * 0.18, w: W * 0.44, h: H * 0.70
    };
    beaker.surfaceY = beaker.y + 30;
    beaker.bottomY = beaker.y + beaker.h;
    var compact = W < 520;
    var bar = {
      x: compact ? W * 0.795 : W * 0.76, y: H * 0.28,
      w: compact ? 14 : 18, h: H * 0.54
    };
    var obj = { rx: W * (compact ? 0.042 : 0.048), ry: H * (compact ? 0.055 : 0.062) };
    return { beaker: beaker, bar: bar, obj: obj };
  }

  /* ===== 物理 ===== */
  function weight() { return rhoObj * VOL * G_ACC / 1000; }         // N
  function fBuoyFull() { return rhoLiq * VOL * G_ACC / 1000; }       // N
  function stateCode() {
    var diff = rhoObj - rhoLiq;
    if (Math.abs(diff) < 0.02) return 2;      // 悬浮
    return diff < 0 ? 1 : 3;                  // 漂浮 / 下沉
  }
  function immersedFraction() {
    var s = stateCode();
    if (s === 3) return 1;
    if (s === 2) return 1;
    return Math.max(0.02, Math.min(1, rhoObj / rhoLiq));
  }
  function actualBuoyancy() {
    var s = stateCode();
    if (s === 1) return weight();                       // 漂浮：F浮 = G
    return fBuoyFull();
  }
  function supportForce() {
    if (stateCode() !== 3) return 0;
    return Math.max(0, weight() - fBuoyFull());
  }

  /* ===== 小工具 ===== */
  function rr(x, y, w, hh, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + hh - r);
    ctx.quadraticCurveTo(x + w, y + hh, x + w - r, y + hh);
    ctx.lineTo(x + r, y + hh);
    ctx.quadraticCurveTo(x, y + hh, x, y + hh - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }
  function text(str, x, y, color, size, align, weight) {
    ctx.save();
    ctx.fillStyle = color;
    ctx.font = (weight || '500') + ' ' + (size || 12) + 'px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(str, x, y);
    ctx.restore();
  }
  function arrow(x1, y1, x2, y2, color, width, halo) {
    var ang = Math.atan2(y2 - y1, x2 - x1);
    var head = 7;
    ctx.save();
    if (halo) { ctx.shadowColor = 'rgba(0,0,0,0.85)'; ctx.shadowBlur = 4; }
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = width || 2;
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x2, y2);
    ctx.lineTo(x2 - head * Math.cos(ang - 0.4), y2 - head * Math.sin(ang - 0.4));
    ctx.lineTo(x2 - head * Math.cos(ang + 0.4), y2 - head * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  /* ===== 目标位置 ===== */
  function targetCenterY() {
    var L = layout(), bk = L.beaker, o = L.obj;
    var s = stateCode();
    if (s === 1) {
      var f = immersedFraction();
      var hi = o.ry * 2 * f;                     // 浸入高度
      return bk.surfaceY + hi - o.ry;            // 物体中心
    }
    if (s === 2) {
      return (bk.surfaceY + bk.bottomY) / 2;
    }
    return bk.bottomY - o.ry - 3;
  }

  /* ===== 主绘制 ===== */
  function draw(dt) {
    var L = layout();
    var bk = L.beaker, o = L.obj, bar = L.bar;
    var g = gray();
    var TH = App.getTheme();

    var cInk = g ? '#111111' : '#2c3e50';
    var cMuted = g ? '#666666' : '#7f8c8d';
    var cGlass = g ? '#bbbbbb' : '#c7d6e2';
    var cFb = g ? '#ffffff' : TH.ray1;
    var cG = g ? '#ffffff' : TH.ray2;

    // 液体颜色随盐度加深
    var t = Math.max(0, Math.min(1, (rhoLiq - 0.90) / 0.50));
    var topCol, botCol;
    if (g) {
      topCol = '#9d9d9d'; botCol = '#6b6b6b';
    } else {
      topCol = mix('#a9dcf5', '#6fb8d8', t);
      botCol = mix('#4aa3df', '#1f6d94', t);
    }

    // 位置平滑
    var tx = bk.x + bk.w / 2;
    var ty = targetCenterY();
    if (curX === null) { curX = tx; curY = ty; }
    var lp = dt ? Math.min(1, dt * 6) : 0.16;
    curX += (tx - curX) * lp;
    curY += (ty - curY) * lp;
    var targetTilt = stateCode() === 3 ? 0 : Math.sin(Date.now() / 900) * 0.03;
    curTilt += (targetTilt - curTilt) * 0.06;

    ctx.clearRect(0, 0, W, H);

    /* --- 烧杯后壁 --- */
    ctx.save();
    ctx.fillStyle = g ? 'rgba(0,0,0,0.05)' : 'rgba(236,244,250,0.85)';
    rr(bk.x, bk.y, bk.w, bk.h, 12);
    ctx.fill();
    ctx.strokeStyle = cGlass;
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();

    /* --- 液体 --- */
    ctx.save();
    rr(bk.x + 6, bk.surfaceY, bk.w - 12, bk.bottomY - bk.surfaceY - 6, 6);
    ctx.clip();
    var grd = ctx.createLinearGradient(0, bk.surfaceY, 0, bk.bottomY);
    grd.addColorStop(0, topCol);
    grd.addColorStop(1, botCol);
    ctx.fillStyle = grd;
    ctx.fillRect(bk.x, bk.surfaceY - 2, bk.w, bk.h);

    // 盐粒
    if (rhoLiq > 1.02) {
      ctx.fillStyle = g ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.35)';
      for (var i = 0; i < 26; i++) {
        var px = bk.x + 14 + ((i * 37) % (bk.w - 28));
        var py = bk.bottomY - 8 - ((i * 53) % 26);
        ctx.beginPath();
        ctx.arc(px, py, 1.4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.restore();

    /* --- 物体（鸡蛋） --- */
    drawEgg(curX, curY, o.rx, o.ry, curTilt, bk.surfaceY, bk.bottomY, cInk, g);

    /* --- 液面线 --- */
    ctx.save();
    ctx.strokeStyle = g ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    var t2 = Date.now() / 900;
    ctx.beginPath();
    for (var x = bk.x + 6; x <= bk.x + bk.w - 6; x += 4) {
      var wy = bk.surfaceY + Math.sin(x / 28 + t2) * 1.6;
      if (x === bk.x + 6) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    ctx.stroke();
    ctx.restore();

    /* --- 悬浮气泡 --- */
    updateBubbles(bk);
    var j, b;
    for (j = 0; j < bubbles.length; j++) {
      b = bubbles[j];
      ctx.save();
      ctx.strokeStyle = g ? 'rgba(255,255,255,0.5)' : 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
    for (j = bubbles.length - 1; j >= 0; j--) {
      bubbles[j].y -= bubbles[j].v;
      if (bubbles[j].y < bk.surfaceY) bubbles.splice(j, 1);
    }

    /* --- 受力箭头 --- */
    if (showForce) {
      var s = stateCode();
      var fLenB = 18 + Math.min(40, actualBuoyancy() * 20);
      var fx = curX + o.rx + 20;
      arrow(fx, curY + 10, fx, curY + 10 - fLenB, cFb, 2.6, g);
      text('F浮', fx + 6, curY + 10 - fLenB - 4, cFb, 11, 'left', '700');

      var gStart = curY - o.ry * 0.65;
      var fLenG = Math.min(18 + Math.min(40, weight() * 20), bk.bottomY - 10 - gStart);
      var gx = curX - o.rx - 20;
      arrow(gx, gStart, gx, gStart + fLenG, cG, 2.6, g);
      text('G', gx - 6, gStart + fLenG + 4, cG, 11, 'right', '700');

      if (s === 3) {
        var ny = Math.min(bk.bottomY - 6, curY + o.ry + 8);
        arrow(curX, ny, curX, ny - 16, g ? '#ffffff' : '#8e44ad', 2.2, g);
        text('N', curX + 7, ny - 18, g ? '#999' : '#8e44ad', 11, 'left', '700');
      }
    }

    /* --- 顶部标注 --- */
    if (W < 520) {
      text('ρ物 ' + rhoObj.toFixed(2) + '　ρ液 ' + rhoLiq.toFixed(2), bk.x, bk.y - 12, cInk, 11, 'left', '600');
    } else {
      text('ρ物 = ' + rhoObj.toFixed(2) + ' g/cm³', bk.x, bk.y - 16, cInk, 12.5, 'left', '600');
      text('ρ液 = ' + rhoLiq.toFixed(2) + ' g/cm³', bk.x + bk.w, bk.y - 16, cMuted, 12.5, 'right');
    }

    /* --- 盐度条 --- */
    if (showSalt) drawSaltBar(bar, g, cInk, cMuted);

    document.getElementById('lgObj').style.setProperty('--c', g ? '#9a9a9a' : '#e8d5b7');
    document.getElementById('lgLiq').style.setProperty('--c', botCol);
    document.getElementById('lgFb').style.setProperty('--c', g ? '#888888' : cFb);

    updateReadout();
    highlight(stateCode());
  }

  function mix(a, b, t) {
    function hex(c) { return [parseInt(c.substr(1, 2), 16), parseInt(c.substr(3, 2), 16), parseInt(c.substr(5, 2), 16)]; }
    var A = hex(a), B = hex(b);
    var r = Math.round(A[0] + (B[0] - A[0]) * t);
    var g2 = Math.round(A[1] + (B[1] - A[1]) * t);
    var bl = Math.round(A[2] + (B[2] - A[2]) * t);
    return 'rgb(' + r + ',' + g2 + ',' + bl + ')';
  }

  function drawEgg(cx, cy, rx, ry, tilt, surfaceY, bottomY, cInk, g) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(tilt);

    // 阴影
    ctx.save();
    ctx.globalAlpha = 0.10;
    ctx.fillStyle = '#000';
    ctx.beginPath();
    ctx.ellipse(3, 5, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // 蛋体
    var grd = ctx.createRadialGradient(-rx * 0.35, -ry * 0.45, rx * 0.15, 0, 0, rx * 1.6);
    if (g) {
      grd.addColorStop(0, '#f0f0f0');
      grd.addColorStop(0.45, '#cfcfcf');
      grd.addColorStop(1, '#8a8a8a');
    } else {
      grd.addColorStop(0, '#fffaf0');
      grd.addColorStop(0.38, '#f3ddb4');
      grd.addColorStop(1, '#b8925f');
    }
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = g ? '#777' : 'rgba(150,120,80,0.55)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 高光
    ctx.save();
    ctx.globalAlpha = 0.65;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.ellipse(-rx * 0.34, -ry * 0.4, rx * 0.22, ry * 0.16, -0.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    ctx.restore();

    // 浸入部分（在液面以下的部分加深）
    ctx.save();
    ctx.beginPath();
    ctx.rect(cx - rx * 2, surfaceY, rx * 4, bottomY - surfaceY);
    ctx.clip();
    ctx.beginPath();
    ctx.ellipse(cx, cy, rx, ry, tilt, 0, Math.PI * 2);
    ctx.fillStyle = g ? 'rgba(255,255,255,0.08)' : 'rgba(41,128,185,0.13)';
    ctx.fill();
    ctx.restore();
  }

  function drawSaltBar(bar, g, cInk, cMuted) {
    ctx.save();
    // 轨道
    rr(bar.x, bar.y, bar.w, bar.h, bar.w / 2);
    ctx.fillStyle = g ? '#2a2a2a' : '#dde8f0';
    ctx.fill();
    ctx.strokeStyle = g ? '#bbb' : '#b9cbd8';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // 盐水填充
    var ratio = Math.max(0, Math.min(1, (rhoLiq - 0.90) / 0.50));
    var fillH = bar.h * ratio;
    ctx.save();
    rr(bar.x, bar.y, bar.w, bar.h, bar.w / 2);
    ctx.clip();
    ctx.fillStyle = g ? '#6a6a6a' : '#5dade2';
    ctx.fillRect(bar.x, bar.y + bar.h - fillH, bar.w, fillH);
    ctx.restore();

    // 手柄
    var hy = bar.y + bar.h - fillH;
    ctx.beginPath();
    ctx.arc(bar.x + bar.w / 2, hy, bar.w * 0.85, 0, Math.PI * 2);
    ctx.fillStyle = g ? '#ffffff' : '#ffffff';
    ctx.fill();
    ctx.strokeStyle = g ? '#000' : '#3498db';
    ctx.lineWidth = 2.6;
    ctx.stroke();

    // 刻度
    text('盐', bar.x + bar.w / 2, bar.y - 14, cInk, 11.5, 'center', '600');
    text('1.40', bar.x + bar.w + 8, bar.y + 4, cMuted, 10, 'left');
    text('0.90', bar.x + bar.w + 8, bar.y + bar.h - 4, cMuted, 10, 'left');
    text('可拖', bar.x + bar.w / 2, bar.y + bar.h + 16, cMuted, 10, 'center');
    ctx.restore();
  }

  function updateBubbles(bk) {
    if (stateCode() !== 2) return;
    if (Math.random() > 0.12) return;
    bubbles.push({
      x: curX + (Math.random() - 0.5) * 50,
      y: curY + 10,
      r: 1.2 + Math.random() * 1.6,
      v: 0.5 + Math.random() * 0.8
    });
    if (bubbles.length > 24) bubbles.shift();
  }

  /* ===== 读数 ===== */
  function updateReadout() {
    var s = stateCode();
    var label = s === 1 ? '漂浮' : s === 2 ? '悬浮' : '下沉';
    var color = s === 1 ? '#27ae60' : s === 2 ? '#3498db' : '#e74c3c';
    var G = weight(), F = actualBuoyancy();
    var html = '';
    html += 'ρ物 = <b>' + rhoObj.toFixed(2) + '</b>　ρ液 = <b>' + rhoLiq.toFixed(2) + '</b> g/cm³<br>';
    html += '状态：<span class="badge" style="background:' + color + '">' + label + '</span><br>';
    html += 'G = <b>' + G.toFixed(2) + '</b> N　F浮 = <b>' + F.toFixed(2) + '</b> N<br>';
    if (s === 1) {
      html += '浸入体积占比 <b>' + (immersedFraction() * 100).toFixed(0) + '%</b>，露出 ' +
              ((1 - immersedFraction()) * 100).toFixed(0) + '%<br>';
      html += 'F浮 = G，物体平衡';
    } else if (s === 2) {
      html += '全部浸没且 F浮 = G，停在液体任意深度';
    } else {
      html += '支持力 N = G − F浮 = <b>' + supportForce().toFixed(2) + '</b> N';
    }
    document.getElementById('readout').innerHTML = html;
  }

  function highlight(c) {
    var rows = document.querySelectorAll('#caseTable tbody tr');
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', rows[i].getAttribute('data-case') === String(c));
    }
  }

  /* ===== 交互 ===== */
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function pos(e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }
  function inBar(p) {
    var bar = layout().bar;
    return p.x > bar.x - 26 && p.x < bar.x + bar.w + 26 && p.y > bar.y - 18 && p.y < bar.y + bar.h + 22;
  }
  function applyBar(p) {
    var bar = layout().bar;
    var ratio = clamp((bar.y + bar.h - p.y) / bar.h, 0, 1);
    rhoLiq = Math.round((0.90 + ratio * 0.50) * 100) / 100;
    document.getElementById('rliqRange').value = rhoLiq;
    document.getElementById('rliqVal').textContent = rhoLiq.toFixed(2);
    draw();
  }

  canvas.addEventListener('pointerdown', function(e) {
    var p = pos(e);
    if (!showSalt || !inBar(p)) return;
    dragSalt = true;
    applyBar(p);
    if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  canvas.addEventListener('pointermove', function(e) {
    var p = pos(e);
    if (!dragSalt) {
      canvas.style.cursor = (showSalt && inBar(p)) ? 'ns-resize' : 'default';
      return;
    }
    applyBar(p);
  });
  function endDrag(e) {
    if (!dragSalt) return;
    dragSalt = false;
    try { if (canvas.releasePointerCapture) canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('pointerleave', function(e) { if (dragSalt) endDrag(e); });

  document.getElementById('robRange').addEventListener('input', function(e) {
    rhoObj = parseFloat(e.target.value);
    document.getElementById('robVal').textContent = rhoObj.toFixed(2);
    draw();
  });
  document.getElementById('objSel').addEventListener('change', function(e) {
    rhoObj = parseFloat(e.target.value);
    document.getElementById('robRange').value = rhoObj;
    document.getElementById('robVal').textContent = rhoObj.toFixed(2);
    draw();
  });
  document.getElementById('rliqRange').addEventListener('input', function(e) {
    rhoLiq = parseFloat(e.target.value);
    document.getElementById('rliqVal').textContent = rhoLiq.toFixed(2);
    draw();
  });
  document.getElementById('showForce').addEventListener('change', function(e) {
    showForce = e.target.checked; draw();
  });
  document.getElementById('showSalt').addEventListener('change', function(e) {
    showSalt = e.target.checked; draw();
  });

  /* ===== 播放：自动加盐 ===== */
  var playBtn = document.getElementById('playBtn');
  function stopPlay() {
    playing = false;
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    playBtn.textContent = '▶ 自动加盐';
  }
  function tick(ts) {
    if (!playing) return;
    if (!lastT) lastT = ts;
    var dt = Math.min(0.05, (ts - lastT) / 1000);
    lastT = ts;
    rhoLiq += playDir * 0.06 * dt;
    if (rhoLiq >= 1.40) { rhoLiq = 1.40; playDir = -1; }
    if (rhoLiq <= 0.95) { rhoLiq = 0.95; playDir = 1; }
    document.getElementById('rliqRange').value = rhoLiq;
    document.getElementById('rliqVal').textContent = rhoLiq.toFixed(2);
    draw(dt);
    rafId = requestAnimationFrame(tick);
  }
  playBtn.addEventListener('click', function() {
    if (playing) { stopPlay(); return; }
    playing = true;
    playDir = (rhoLiq > 1.35) ? -1 : 1;
    lastT = 0;
    playBtn.textContent = '⏸ 暂停';
    rafId = requestAnimationFrame(tick);
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    stopPlay();
    rhoObj = 1.03; rhoLiq = 1.00; showForce = true; showSalt = true;
    bubbles = []; curX = null; curY = null; curTilt = 0;
    document.getElementById('robRange').value = 1.03;
    document.getElementById('robVal').textContent = '1.03';
    document.getElementById('objSel').value = '1.03';
    document.getElementById('rliqRange').value = 1.00;
    document.getElementById('rliqVal').textContent = '1.00';
    document.getElementById('showForce').checked = true;
    document.getElementById('showSalt').checked = true;
    draw();
  });

  window.addEventListener('themechange', function() { draw(); });
  window.addEventListener('resize', function() { fit(); curX = null; curY = null; draw(); });

  /* 常驻轻动画（液面波纹 / 位置阻尼） */
  var lastFrame = 0, lastDraw = 0;
  function loop(ts) {
    if (!lastFrame) lastFrame = ts;
    var dt = Math.min(0.05, (ts - lastFrame) / 1000);
    lastFrame = ts;
    if (!playing) {
      var moving = Math.abs(targetCenterY() - curY) > 0.4 || Math.abs(curTilt) > 0.004;
      var gap = moving ? 16 : 110;            // 静止时降频，省电
      if (ts - lastDraw >= gap) { draw(dt); lastDraw = ts; }
    }
    requestAnimationFrame(loop);
  }

  fit();
  draw();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
