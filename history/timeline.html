<link rel="stylesheet" href="../shared/style.css">
<style>
  #readout b { color: #3b82f6; }
  .stage canvas { touch-action: none; }
  .lab-main { display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; }
  .case-table { cursor: pointer; }
  .case-table tr:hover td { background-color: #f1f5f9; }

    font-size: 12px;

<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>中国历史时间轴</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>时期</th><th>时间跨度</th></tr></thead>
    <tbody id="tableBody">
      <!-- 由 JS 动态生成 -->
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>视图缩放 = <span id="zoomVal">1.0</span> ×
    <input type="range" id="zoomRange" min="0.5" max="3" value="1" step="0.1">
  </label>

  <div class="row"><input type="checkbox" id="lineToggle" checked><label for="lineToggle" style="margin:0">显示辅助连线</label></div>

  <button id="resetBtn" class="secondary">↺ 重置视角</button>

  <div class="readout" id="readout">
    点击画布中的朝代卡片展开分支<br>
    点击分支展开大事记<br>
    点击空白处返回上一级
  </div>
  <div class="nav-hint">💡 支持双指缩放与拖拽平移</div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>

<div class="site-footer">

</div>

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  var cssW = 800, cssH = 500, dpr = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var targetView = { cx: 0, cy: 0, scale: 1 };
  var showLine = true;

  var activeL1 = null;
  var activeL2 = null;

  // =============== 数据（详细科普版） ===============
  var DATA = [
    { id: 'prehistory', name: '史前时代', time: '约170万年前-前2070年', branches: [
      { name: '旧石器时代', events: [
        { title: '元谋人与北京人', desc: '元谋人距今约170万年，发现于云南元谋县，是我国境内目前已知最早的古人类，他们已经会制作简单的打制石器和知道使用火。北京人距今约70万至20万年，发现于北京周口店龙骨山，他们的手脚分工明显，能够直立行走，并且会使用天然火及长时间保存火种。火的使用增强了人类适应自然的能力，促进了体质的发展和脑的进化，是人类进化史上的重要里程碑。' },
        { title: '山顶洞人', desc: '距今约3万年，发现于北京周口店龙骨山顶部的洞穴中。山顶洞人的模样和现代人基本相同，他们已经掌握了磨光和钻孔技术，会人工取火，会用骨针缝制衣服，懂得爱美，死后还要埋葬。他们共同劳动，共同分配食物，没有贫富贵贱的差别，过着氏族公社的社会生活。' }
      ]},
      { name: '新石器时代', events: [
        { title: '农耕文明的兴起', desc: '距今约1万年左右，中国进入新石器时代。黄河流域的仰韶文化（如半坡遗址）以彩陶为特色，长江流域的河姆渡遗址发现了大量人工栽培水稻的遗迹，证明中国是世界上最早栽培水稻的国家之一。人们开始定居，建造房屋，饲养家畜，磨制石器，社会由母系氏族向父系氏族过渡。' }
      ]},
      { name: '传说时代', events: [
        { title: '炎黄与尧舜禹', desc: '四五千年前，黄河流域的炎帝和黄帝部落结成联盟，在涿鹿之战中打败蚩尤，逐渐形成华夏族。尧、舜、禹时期实行禅让制，将首领位置传给贤德之人。大禹采用疏导的方法治理黄河水患，历经十三年，三过家门而不入，最终成功治水，威望大增。' }
      ]}
    ]},
    { id: 'xia', name: '夏朝', time: '约前2070-前1600年', branches: [
      { name: '夏朝建立', events: [
        { title: '大禹建夏与世袭制', desc: '公元前2070年，禹建立夏朝，这是我国历史上第一个王朝，标志着中国早期国家的产生。禹死后，他的儿子启继承父位，世袭制代替了禅让制，“公天下”变成了“家天下”。夏朝建立了军队，制定刑法，设置监狱，制定了历法（夏历），具备了国家的基本特征。' }
      ]},
      { name: '夏朝灭亡', events: [
        { title: '夏桀暴政与商汤灭夏', desc: '夏朝后期，桀在位时残暴无道，滥用民力，激起奴隶和平民的反抗。黄河下游的商部落在首领汤的领导下，联合各部落起兵伐夏，在鸣条之战中打败夏桀，夏朝灭亡。' }
      ]}
    ]},
    { id: 'shang', name: '商朝', time: '约前1600-前1046年', branches: [
      { name: '盘庚迁殷', events: [
        { title: '商朝中興', desc: '公元前1600年商汤建立商朝，前期因水患和内部动乱多次迁都。商王盘庚为了巩固统治，将都城迁到殷（今河南安阳）。此后商朝的统治稳定下来，因此商朝又被称为“殷朝”。商朝是当时世界上最大的国家之一。' }
      ]},
      { name: '青铜与文字', events: [
        { title: '司母戊鼎与甲骨文', desc: '商朝的青铜器铸造业高度发达，后母戊鼎（原称司母戊鼎）重达832.84千克，是目前世界上出土的最重的青铜器。商朝人将占卜的内容刻写在龟甲和兽骨上，形成了甲骨文。甲骨文是中国已发现的古代文字中年代最早、体系较为完整的文字，我国有文字可考的历史从商朝开始。' }
      ]},
      { name: '商朝灭亡', events: [
        { title: '武王伐纣', desc: '商纣王在位时，修建豪华宫殿，对百姓征收繁重的赋税，施用酷刑，残害人民。公元前1046年，周武王联合各地势力，在牧野之战中大败商军，商朝灭亡。' }
      ]}
    ]},
    { id: 'zhou', name: '周朝', time: '前1046-前256年', branches: [
      { name: '西周时期', events: [
        { title: '分封制与宗法制', desc: '周王根据血缘关系远近和功劳大小，将土地和人民分封给宗亲和功臣，建立诸侯国，以稳定周初政治形势。诸侯需向周王进献贡物，服从调兵。宗法制以嫡长子继承制为核心，确立了严格的大宗与小宗体系，巩固了周王天下共主的地位。' },
        { title: '国人暴动与西周灭亡', desc: '周厉王暴虐，引发国人暴动。周幽王时，朝政腐败，为博褒姒一笑“烽火戏诸侯”，失去诸侯信任。公元前771年，犬戎攻破镐京，西周灭亡。次年周平王东迁洛邑，史称东周。' }
      ]},
      { name: '春秋争霸', events: [
        { title: '尊王攘夷', desc: '春秋时期，周王室衰微，诸侯争霸。齐桓公任用管仲为相，打出“尊王攘夷”的旗号，在葵丘会盟诸侯，成为春秋时期第一个霸主。晋文公在城濮之战中退避三舍，大败楚军，成为中原霸主。' }
      ]},
      { name: '战国七雄', events: [
        { title: '商鞅变法', desc: '战国时期，铁制农具和牛耕推广。秦孝公任用商鞅变法，奖励耕织，废除井田制，推行县制，严明法度。秦国实力大增，成为最强盛的诸侯国，为统一六国奠定基础。' },
        { title: '百家争鸣', desc: '春秋战国时期，社会急剧变化，各学派纷纷著书立说。儒家孔子提出“仁”，创办私学；孟子主张“仁政”。道家老子主张“无为而治”，庄子强调顺应自然。法家韩非强调以法治国，建立中央集权。思想文化空前繁荣。' }
      ]}
    ]},
    { id: 'qin', name: '秦朝', time: '前221-前207年', branches: [
      { name: '统一六国', events: [
        { title: '秦始皇统一中国', desc: '公元前230年至前221年，秦王嬴政先后灭韩、赵、魏、楚、燕、齐六国，建立起我国历史上第一个统一的多民族的封建国家，定都咸阳。他认为自己的功过三皇五帝，自称“始皇帝”，创立了皇帝制度，在中央设丞相、太尉、御史大夫。' }
      ]},
      { name: '巩固统一', events: [
        { title: '郡县制', desc: '在地方，废除分封制，建立由中央直接管辖的郡县制。郡县长官由朝廷直接任免，开创了此后我国历代王朝地方行政的基本模式，对后世影响深远。' },
        { title: '书同文车同轨', desc: '统一文字为小篆，作为通用规范文字；统一货币为圆形方孔半两钱；统一度量衡；统一车辆和道路的宽窄；修筑西起临洮、东到辽东的万里长城；开凿灵渠，沟通湘江和漓江。' }
      ]},
      { name: '秦末起义', events: [
        { title: '大泽乡起义', desc: '秦的暴政（繁重徭役、沉重赋税、严苛刑法）引发陈胜吴广起义（大泽乡起义），这是中国历史上第一次大规模农民起义，沉重打击了秦朝的统治。随后项羽、刘邦起兵，巨鹿之战项羽大败秦军主力，刘邦攻入咸阳，秦朝灭亡。' }
      ]}
    ]},
    { id: 'han', name: '汉朝', time: '前202-220年', branches: [
      { name: '西汉初期', events: [
        { title: '文景之治', desc: '刘邦战胜项羽建立汉朝，定都长安。汉初实行休养生息政策，注重农业生产，减轻赋税徭役。汉文帝、汉景帝时期，提倡勤俭治国，政治清明，经济发展，人民生活安定。历史上称为“文景之治”。' }
      ]},
      { name: '汉武帝大一统', events: [
        { title: '推恩令与思想统一', desc: '汉武帝采纳主父偃的建议，颁布“推恩令”，削弱诸侯王势力；设立刺史监视地方；接受董仲舒“罢黜百家，尊崇儒术”的建议，把儒家学说立为正统思想，在长安兴办太学，培养统治阶级需要的儒学人才。' },
        { title: '张骞通西域', desc: '汉武帝派张骞两次出使西域，开辟了通往西域的道路。丝绸之路成为东西方经济文化交流的桥梁，中国的丝绸、瓷器、茶叶等传到西方，西域的良种马、香料、玻璃等传入中国。' }
      ]},
      { name: '东汉兴衰', events: [
        { title: '光武中兴', desc: '王莽篡汉后，刘秀建立东汉，定都洛阳。光武帝多次下令释放奴婢，减轻农民负担，裁并郡县，整顿吏治，社会安定，经济恢复。' },
        { title: '蔡伦改进造纸术', desc: '东汉时期，宦官蔡伦改进造纸工艺，用树皮、麻头、破布、旧渔网等植物纤维为原料造纸，质量提高，原料易找，价格便宜，易于推广。' }
      ]}
    ]},
    { id: 'sanguo', name: '三国两晋', time: '220-420年', branches: [
      { name: '三国鼎立', events: [
        { title: '赤壁之战与三国建立', desc: '208年，孙刘联军在赤壁以少胜多，大败曹军。赤壁之战对当时整个局势有关键性的影响，为三国鼎立局面的形成奠定了基础。220年曹丕称帝建魏；221年刘备在成都称帝建汉（蜀汉）；229年孙权称帝建吴，定都建业。' }
      ]},
      { name: '西晋与东晋', events: [
        { title: '八王之乱与五胡内迁', desc: '司马炎建立西晋，灭吴统一全国。但西晋统治者腐朽，爆发“八王之乱”。随后内迁的匈奴、鲜卑、羯、氐、羌等少数民族起兵反晋，西晋灭亡。317年司马睿建立东晋。' },
        { title: '淝水之战', desc: '前秦苻坚率领大军南下，企图灭亡东晋。东晋在淝水之战中以少胜多，大败前秦。前秦统治瓦解，北方重新陷入分裂。' }
      ]},
      { name: '江南开发', events: [
        { title: '经济重心南移', desc: '北方人口大量南迁，带去了劳动力、先进生产工具和技术。江南地区得到开发，兴修水利，农业、手工业和商业迅速发展，为经济重心南移奠定了基础。' }
      ]}
    ]},
    { id: 'sui', name: '隋朝', time: '581-618年', branches: [
      { name: '开皇之治', events: [
        { title: '隋朝统一', desc: '589年隋文帝灭陈，统一全国，结束了长期分裂的局面。隋文帝发展经济，编订户籍，统一南北币制和度量衡制度，加强中央集权，社会经济迅速恢复，国力强盛。' }
      ]},
      { name: '大运河与科举', events: [
        { title: '隋朝大运河', desc: '隋炀帝下令开凿大运河，以洛阳为中心，北抵涿郡，南至余杭。大运河全长2000多千米，加强了南北地区政治、经济和文化交流，但也加重了人民负担。' },
        { title: '开创科举制', desc: '隋文帝初步建立通过考试选拔人才的制度。隋炀帝时，进士科的创立，标志着科举制的正式确立。科举制是中国古代选官制度的一大变革，加强了皇帝在选官和用人上的权力。' }
      ]},
      { name: '隋朝灭亡', events: [
        { title: '瓦岗军起义', desc: '隋炀帝好大喜功，多次发动对高丽的战争，滥用民力。农民起义席卷全国，李渊在太原起兵，618年隋朝灭亡。' }
      ]}
    ]},
    { id: 'tang', name: '唐朝', time: '618-907年', branches: [
      { name: '贞观之治', events: [
        { title: '唐太宗纳谏', desc: '唐太宗李世民虚心纳谏，重用房玄龄、杜如晦、魏征。完善三省六部制，减轻赋税，完善科举。政治清明，经济得到进一步发展，国力增强。' },
        { title: '文成公主入藏', desc: '唐太宗将文成公主嫁给吐蕃赞普松赞干布，促进了吐蕃经济和社会的发展，增进了汉藏两族的友好关系。' }
      ]},
      { name: '女皇武则天', events: [
        { title: '政启开元，治宏贞观', desc: '武则天是中国历史上唯一的女皇帝。她打击敌对的官僚贵族，大力发展科举制，创立殿试制度，不拘一格选拔人才。她在位期间，社会经济持续发展，为开元盛世奠定了基础。' }
      ]},
      { name: '开元盛世', events: [
        { title: '唐玄宗励精图治', desc: '唐玄宗即位后，稳定政局，励精图治，任用贤能（姚崇、宋璟），发展经济，注重文教。唐朝进入全盛时期，历史上称为“开元盛世”。' }
      ]},
      { name: '安史之乱', events: [
        { title: '唐朝由盛转衰', desc: '755年，安禄山和史思明发动叛乱。安史之乱对社会经济造成极大的破坏，尤其是北方地区遭到浩劫，唐朝国势由盛转衰。此后形成藩镇割据局面。' }
      ]},
      { name: '唐末起义', events: [
        { title: '黄巢起义', desc: '唐朝后期，宦官专权，藩镇割据。黄巢领导的农民起义沉重打击了唐朝统治。907年，朱温建立后梁，唐朝灭亡，进入五代十国时期。' }
      ]}
    ]},
    { id: 'song', name: '宋朝', time: '960-1279年', branches: [
      { name: '北宋建立', events: [
        { title: '陈桥兵变', desc: '赵匡胤建立北宋，定都开封。他采取“杯酒释兵权”等方式，解除禁军将领的兵权，实行重文轻武政策，防止武将专权。' }
      ]},
      { name: '澶渊之盟', events: [
        { title: '宋辽和议', desc: '宋真宗时，辽军大举攻宋，宰相寇准力劝皇帝亲征，宋军在澶州大败辽军。双方签订“澶渊之盟”，此后辽宋保持了长时间的和平。' }
      ]},
      { name: '王安石变法', events: [
        { title: '熙宁变法', desc: '宋神宗任用王安石变法，推行募役法、方田均税法、农田水利法。变法收到一些成效，但触犯了大官僚大地主的利益，最终失败。' }
      ]},
      { name: '靖康之变', events: [
        { title: '北宋灭亡', desc: '1127年，金军攻破开封，掳走宋徽宗、宋钦宗，北宋灭亡，史称“靖康之变”。赵构在临安建立南宋。' }
      ]},
      { name: '南宋偏安', events: [
        { title: '岳飞抗金', desc: '岳飞率领“岳家军”在郾城大败金军。后宋高宗和秦桧害怕抗金力量壮大，以“莫须有”的罪名杀害了岳飞。宋金达成和议。' },
        { title: '经济与科技繁荣', desc: '南宋时期，江南地区已成为全国的经济重心。宋代海外贸易繁荣，四川地区出现了世界上最早的纸币“交子”。指南针、火药广泛应用于航海和军事。' }
      ]}

  // 布局参数
  var MAIN_Y = 0;
  var L1_W = 140;
  var L1_H = 60;
  var L2_W = 160;
  var L2_H = 32;
  var EVENT_W = 320; // 加宽事件卡片以容纳更多文字

  // 生成表格
  (function(){
    var tbody = document.getElementById('tableBody');
    var html = '';
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];
      html += '<tr data-id="' + d.id + '"><td>' + d.name + '</td><td>' + d.time + '</td></tr>';
    }
    tbody.innerHTML = html;
  })();

  // =============== 自动布局计算 ===============
  function calculateLayout() {
    var currentX = 0;
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];
      d.x = currentX;
      currentX += 300; // L1 节点间距

      d.y = MAIN_Y;
      var currentY = MAIN_Y + 80; // L2 起始 Y 坐标

      for (var j = 0; j < d.branches.length; j++) {
        var b = d.branches[j];
        b.x = d.x;
        b.y = currentY;
        currentY += L2_H + 20; // L2 卡片高度 + 间距

        if (activeL1 === d && activeL2 === b) {
          var evY = currentY + 20;
          for (var k = 0; k < b.events.length; k++) {
            var ev = b.events[k];
            ev.x = d.x;
            ev.y = evY;
            
            // 动态计算文本高度 (假定中文字符宽12px，行高20px)
            var charsPerLine = Math.floor((EVENT_W - 30) / 12); 
            var lines = Math.ceil(ev.desc.length / charsPerLine);
            if (lines < 1) lines = 1;
            
            // 高度 = 标题区(30) + 内容行数 * 行高(20) + 底部 padding(15)
            ev.h = 30 + lines * 20 + 15;
            
            evY += ev.h + 20;
          }
          currentY = evY + 20;
        }
      }
    }
  }

  // =============== 尺寸 ===============
  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  // =============== 坐标转换 ===============
  function w2s(x, y) {
    return [
      cssW / 2 + (x - view.cx) * view.scale,
      cssH / 2 + (y - view.cy) * view.scale
    ];
  }

  // =============== 绘制 ===============
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // 自动换行绘制文字
  function wrapText(text, maxWidth, lineHeight, x, y, align, color) {
    ctx.fillStyle = color;
    var line = '';
    var testLine = '';
    var lineY = y;
    for (var n = 0; n < text.length; n++) {
      testLine += text[n];
      var metrics = ctx.measureText(testLine);
      if (metrics.width > maxWidth && n > 0) {
        var drawX = align === 'center' ? x - ctx.measureText(line).width / 2 : x;
        ctx.fillText(line, drawX, lineY);
        line = text[n];
        testLine = text[n];
        lineY += lineHeight;
      } else {
        line = testLine;
      }
    }
    var drawX2 = align === 'center' ? x - ctx.measureText(line).width / 2 : x;
    ctx.fillText(line, drawX2, lineY);
    return lineY + lineHeight;
  }

  function draw() {
    var TH = App.getTheme();
    var bg = '#0f172a';
    var cMain = TH.ray1;
    var cL1 = TH.ray2;
    var cL2 = TH.ray3;
    var textColor = '#e2e8f0';
    var subTextColor = '#94a3b8';

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, cssW, cssH);

    var startX = DATA[0].x - 100;
    var endX = DATA[DATA.length-1].x + 100;
    var sStart = w2s(startX, MAIN_Y);
    var sEnd = w2s(endX, MAIN_Y);

    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 4 * view.scale;
    ctx.beginPath();
    ctx.moveTo(sStart[0], sStart[1]);
    ctx.lineTo(sEnd[0], sEnd[1]);
    ctx.stroke();

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];
      var isL1Active = (activeL1 === d);
      var p = w2s(d.x, MAIN_Y);
      var w = L1_W * view.scale;
      var h = L1_H * view.scale;

      if (p[0] < -w * 3 || p[0] > cssW + w * 3) continue;

      // 主轴线点
      ctx.fillStyle = cMain;
      ctx.beginPath();
      ctx.arc(p[0], p[1], 6 * view.scale, 0, TAU);
      ctx.fill();

      // L1 卡片
      ctx.save();
      ctx.translate(p[0], p[1] - h - 20 * view.scale);
      ctx.fillStyle = isL1Active ? cL1 : 'rgba(30, 41, 59, 0.9)';
      ctx.strokeStyle = isL1Active ? '#fff' : 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2 * view.scale;
      roundRect(-w/2, -h/2, w, h, 8 * view.scale);
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold ' + (16 * view.scale) + 'px "PingFang SC", sans-serif';
      ctx.fillStyle = isL1Active ? '#fff' : textColor;
      ctx.fillText(d.name, 0, -6 * view.scale);

      ctx.font = (11 * view.scale) + 'px "PingFang SC", sans-serif';
      ctx.fillStyle = isL1Active ? 'rgba(255,255,255,0.8)' : subTextColor;
      ctx.fillText(d.time, 0, 14 * view.scale);
      ctx.restore();

      // 绘制 L2
      if (isL1Active) {
        for (var j = 0; j < d.branches.length; j++) {
          var b = d.branches[j];
          var bp = w2s(b.x, b.y);
          var isL2Active = (activeL2 === b);
          var bw = L2_W * view.scale;
          var bh = L2_H * view.scale;

          if (showLine) {
            ctx.strokeStyle = 'rgba(255,255,255,0.2)';
            ctx.lineWidth = 2 * view.scale;
            ctx.beginPath();
            ctx.moveTo(p[0], p[1]);
            ctx.lineTo(bp[0], bp[1]);
            ctx.stroke();
          }

          ctx.save();
          ctx.translate(bp[0], bp[1]);
          ctx.fillStyle = isL2Active ? cL2 : 'rgba(51, 65, 85, 0.9)';
          ctx.strokeStyle = isL2Active ? '#fff' : 'rgba(255,255,255,0.1)';
          ctx.lineWidth = 1.5 * view.scale;
          roundRect(-bw/2, -bh/2, bw, bh, 6 * view.scale);
          ctx.fill();
          ctx.stroke();

          ctx.font = (13 * view.scale) + 'px "PingFang SC", sans-serif';
          ctx.fillStyle = isL2Active ? '#fff' : textColor;
          ctx.fillText(b.name, 0, 0);
          ctx.restore();

          // 绘制 L3 事件
          if (isL2Active) {
            for (var k = 0; k < b.events.length; k++) {
              var ev = b.events[k];
              var ep = w2s(ev.x, ev.y);
              var ew = EVENT_W * view.scale;
              var eh = ev.h * view.scale;

              if (showLine) {
                ctx.strokeStyle = 'rgba(255,255,255,0.15)';
                ctx.lineWidth = 1.5 * view.scale;
                ctx.beginPath();
                ctx.moveTo(bp[0], bp[1]);
                ctx.lineTo(ep[0], ep[1] - eh/2);
                ctx.stroke();
              }

              ctx.save();
              ctx.translate(ep[0], ep[1]);
              ctx.fillStyle = 'rgba(30, 41, 59, 0.95)';
              ctx.strokeStyle = 'rgba(255,255,255,0.15)';
              ctx.lineWidth = 1 * view.scale;
              roundRect(-ew/2, -eh/2, ew, eh, 8 * view.scale);
              ctx.fill();
              ctx.stroke();

              ctx.font = 'bold ' + (14 * view.scale) + 'px "PingFang SC", sans-serif';
              ctx.fillStyle = cL2;
              ctx.textAlign = 'left';
              ctx.fillText(ev.title, -ew/2 + 15 * view.scale, -eh/2 + 20 * view.scale);

              ctx.font = (12 * view.scale) + 'px "PingFang SC", sans-serif';
              var startTextY = -eh/2 + 45 * view.scale;
              wrapText(ev.desc, ew - 30 * view.scale, 20 * view.scale, -ew/2 + 15 * view.scale, startTextY, 'left', textColor);
              ctx.restore();
            }
          }
        }
      }
    }

    // 星空装饰
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    for (var si = 0; si < 50; si++) {
      var sx = (Math.sin(si * 12.3) * 0.5 + 0.5) * cssW;
      var sy = (Math.cos(si * 45.6) * 0.5 + 0.5) * cssH;
      ctx.beginPath();
      ctx.arc(sx, sy, 1, 0, TAU);
      ctx.fill();
    }

    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }

  // =============== 交互 ===============
  function hitTestL1(px, py) {
    for (var i = 0; i < DATA.length; i++) {
      var d = DATA[i];
      var p = w2s(d.x, MAIN_Y);
      var w = L1_W * view.scale;
      var h = L1_H * view.scale;
      var cx = p[0], cy = p[1] - h - 20 * view.scale;
      if (px >= cx - w/2 && px <= cx + w/2 && py >= cy - h/2 && py <= cy + h/2) {
        return d;
      }
    }
    return null;
  }

  function hitTestL2(px, py) {
    if (!activeL1) return null;
    var d = activeL1;
    for (var j = 0; j < d.branches.length; j++) {
      var b = d.branches[j];
      var bp = w2s(b.x, b.y);
      var bw = L2_W * view.scale;
      var bh = L2_H * view.scale;
      if (px >= bp[0] - bw/2 && px <= bp[0] + bw/2 && py >= bp[1] - bh/2 && py <= bp[1] + bh/2) {
        return b;
      }
    }
    return null;
  }

  function handleTap(px, py) {
    var hitL2 = hitTestL2(px, py);
    if (hitL2) {
      if (activeL2 === hitL2) {
        activeL2 = null;
      } else {
        activeL2 = hitL2;
      }
      calculateLayout();
      return;
    }

    var hitL1 = hitTestL1(px, py);
    if (hitL1) {
      if (activeL1 !== hitL1) {
        activeL1 = hitL1;
        activeL2 = null;
        calculateLayout();
        
        // 相机聚焦该朝代
        targetView.cx = hitL1.x;
        targetView.cy = MAIN_Y + 150;
        targetView.scale = Math.max(targetView.scale, 0.7);
        document.getElementById('zoomRange').value = targetView.scale;
        document.getElementById('zoomVal').textContent = targetView.scale.toFixed(1);
      }
      updateTable();
      return;
    }

    if (activeL2) {
      activeL2 = null;
      calculateLayout();
    } else if (activeL1) {
      activeL1 = null;
      calculateLayout();
      updateTable();
    }
  }

  var pointerState = { active: false, id: null, startX: 0, startY: 0, startCx: 0, startCy: 0, moved: false };
  var pinchState = null;
  var pointers = {};

  canvas.addEventListener('pointerdown', function(e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (Object.keys(pointers).length === 1) {
      var rect = canvas.getBoundingClientRect();
      pointerState.active = true;
      pointerState.id = e.pointerId;
      pointerState.startX = e.clientX - rect.left;
      pointerState.startY = e.clientY - rect.top;
      pointerState.startCx = targetView.cx;
      pointerState.startCy = targetView.cy;
      pointerState.moved = false;
    } else if (Object.keys(pointers).length === 2) {
      pinchState = null;
      updatePinch();
      pointerState.active = false;
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (Object.keys(pointers).length >= 2) {
      updatePinch();
      return;
    }

    if (!pointerState.active || e.pointerId !== pointerState.id) return;

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - pointerState.startX;
    var dy = py - pointerState.startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      pointerState.moved = true;
      targetView.cx = pointerState.startCx - dx / view.scale;
      targetView.cy = pointerState.startCy - dy / view.scale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
    }
  });

  function updatePinch() {
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (dist < 1) return;

    if (!pinchState) {
      var rect = canvas.getBoundingClientRect();
      var midX = (p1.x + p2.x) / 2 - rect.left;
      var midY = (p1.y + p2.y) / 2 - rect.top;
      pinchState = {
        dist: dist,
        scale: targetView.scale,
        midX: midX,
        midY: midY,
        worldX: (midX - cssW / 2) / view.scale + view.cx,
        worldY: (midY - cssH / 2) / view.scale + view.cy
      };
    } else {
      var ratio = dist / pinchState.dist;
      var newScale = pinchState.scale * ratio;
      newScale = Math.max(0.3, Math.min(2.5, newScale));
      
      targetView.scale = newScale;
      targetView.cx = pinchState.worldX - (pinchState.midX - cssW / 2) / newScale;
      targetView.cy = pinchState.worldY - (pinchState.midY - cssH / 2) / newScale;

      view.scale = newScale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;

      document.getElementById('zoomRange').value = newScale;
      document.getElementById('zoomVal').textContent = newScale.toFixed(1);
    }
  }

  function endPointer(e) {
    if (pointerState.active && e.pointerId === pointerState.id && !pointerState.moved) {
      var rect = canvas.getBoundingClientRect();
      handleTap(e.clientX - rect.left, e.clientY - rect.top);
    }

    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchState = null;
    if (Object.keys(pointers).length === 0) pointerState.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // =============== 表格联动 ===============
  function updateTable() {
    var rows = document.querySelectorAll('#tableBody tr');
    var activeId = activeL1 ? activeL1.id : null;
    for (var i = 0; i < rows.length; i++) {
      rows[i].classList.toggle('active', rows[i].getAttribute('data-id') === activeId);
    }
  }

  var trs = document.querySelectorAll('#tableBody tr');
  for (var ti = 0; ti < trs.length; ti++) {
    (function(tr) {
      tr.addEventListener('click', function() {
        var id = tr.getAttribute('data-id');
        var d = DATA.find(function(x){ return x.id === id; });
        if (d) {
          activeL1 = d;
          activeL2 = null;
          calculateLayout();
          targetView.cx = d.x;
          targetView.cy = MAIN_Y + 150;
          targetView.scale = Math.max(targetView.scale, 0.7);
          document.getElementById('zoomRange').value = targetView.scale;
          document.getElementById('zoomVal').textContent = targetView.scale.toFixed(1);
          updateTable();
        }
      });
    })(trs[ti]);
  }

  // =============== 侧栏 ===============
  document.getElementById('zoomRange').addEventListener('input', function(e) {
    targetView.scale = parseFloat(e.target.value);
    document.getElementById('zoomVal').textContent = targetView.scale.toFixed(1);
  });

  document.getElementById('lineToggle').addEventListener('change', function(e) {
    showLine = e.target.checked;
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    targetView.cx = DATA[0].x;
    targetView.cy = MAIN_Y + 150;
    targetView.scale = 1;
    activeL1 = null;
    activeL2 = null;
    calculateLayout();
    document.getElementById('zoomRange').value = 1;
    document.getElementById('zoomVal').textContent = '1.0';
    updateTable();
  });

  // =============== 主循环 ===============
  function frame() {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    view.cx += (targetView.cx - view.cx) * 0.1;
    view.cy += (targetView.cy - view.cy) * 0.1;
    view.scale += (targetView.scale - view.scale) * 0.1;

    if (!isFinite(view.cx)) view.cx = 0;
    if (!isFinite(view.cy)) view.cy = 0;
    if (!isFinite(view.scale) || view.scale <= 0) view.scale = 1;

    draw();
  }

  // =============== 启动 ===============
  resize();
  calculateLayout();
  targetView.cx = DATA[0].x;
  targetView.cy = MAIN_Y + 150;
  view.cx = targetView.cx;
  view.cy = targetView.cy;
  view.scale = targetView.scale;
  
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
