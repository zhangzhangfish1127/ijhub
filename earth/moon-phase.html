<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  // ===== 状态 =====
  var cssW = 800, cssH = 500, dpr = 1;
  var mode = 'phase';
  var age = 7.4;
  var savedPhaseAge = 7.4;
  var speed = 1;
  var playing = true;
  var SYNODIC = 29.53;
  var eclipseProgress = 0;
  var eclipseDir = 1;
  var eclipseSpeed = 1;

  var showRay = true, showOrbit = true, showLine = true;

  // 布局
  var leftW, rightW;
  var earthX, earthY, orbitR, earthR, moonR;
  var rightCx, rightCy, rightR;

  var ageValEl = document.getElementById('ageVal');
  var ageRangeEl = document.getElementById('ageRange');
  var speedValEl = document.getElementById('speedVal');
  var readoutEl = document.getElementById('readout');

  // ===== 工具 =====
  function withAlpha(c, a) {
    if (!c) return 'rgba(0,0,0,' + a + ')';
    c = String(c).trim();
    if (c.charAt(0) === '#') {
      var h = c.slice(1);
      if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
      if (h.length >= 6) {
        var n = parseInt(h.slice(0, 6), 16);
        if (isNaN(n)) return c;
        return 'rgba(' + ((n>>16)&255) + ',' + ((n>>8)&255) + ',' + (n&255) + ',' + a + ')';
      }
    }
    var m = c.match(/^rgba?\(([^)]+)\)$/i);
    if (m) {
      var p = m[1].split(',');
      if (p.length >= 3) return 'rgba(' + p[0].trim() + ',' + p[1].trim() + ',' + p[2].trim() + ',' + a + ')';
    }
    return c;
  }
  function pseudo(seed) {
    var x = Math.sin(seed * 12.9898 + 78.233) * 43758.5453;
    return x - Math.floor(x);
  }

  // ===== 相位计算 =====
  function getPhaseAngle(a) { return (a / SYNODIC) * TAU; }
  function getIllumination(a) { return (1 - Math.cos(getPhaseAngle(a))) / 2; }

  function getPhaseName(a) {
    if (a < 1.85 || a > 27.68) return '新月';
    if (a < 5.54) return '蛾眉月';
    if (a < 9.23) return '上弦月';
    if (a < 12.91) return '盈凸月';
    if (a < 16.60) return '满月';
    if (a < 20.29) return '亏凸月';
    if (a < 23.98) return '下弦月';
    return '残月';
  }

  function getPhaseIndex(a) {
    if (a < 1.85 || a > 27.68) return 0;
    if (a < 5.54) return 1;
    if (a < 9.23) return 2;
    if (a < 12.91) return 3;
    if (a < 16.60) return 4;
    if (a < 20.29) return 5;
    if (a < 23.98) return 6;
    return 7;
  }

  // ===== 尺寸 =====
  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    leftW = cssW * 0.56;
    rightW = cssW * 0.44;

    earthX = leftW * 0.38;
    earthY = cssH * 0.5;
    orbitR = Math.min(leftW * 0.36, cssH * 0.34);
    earthR = Math.min(leftW * 0.09, cssH * 0.11);
    moonR = Math.min(leftW * 0.06, cssH * 0.07);

    rightCx = leftW + rightW * 0.5;
    rightCy = cssH * 0.44;
    rightR = Math.min(rightW * 0.36, cssH * 0.26);
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  // ===== 月相绘制 =====
  function drawMoonPhaseAt(cx, cy, R, a) {
    var phi = getPhaseAngle(a);
    var cosPhi = Math.cos(phi);
    var sinPhi = Math.sin(phi);
    var aRad = R * cosPhi;
    var illum = (1 - cosPhi) / 2;

    // 暗面
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.fillStyle = '#1c1c2a';
    ctx.fill();

    if (illum < 0.005) return;

    if (illum > 0.995) {
      var g = ctx.createRadialGradient(cx - R * 0.2, cy - R * 0.2, R * 0.1, cx, cy, R);
      g.addColorStop(0, '#f5f5ff');
      g.addColorStop(0.7, '#d8d8e0');
      g.addColorStop(1, '#9a9aae');
      ctx.beginPath();
      ctx.arc(cx, cy, R, 0, TAU);
      ctx.fillStyle = g;
      ctx.fill();
      drawCraters(cx, cy, R, 0.35);
      return;
    }

    // 亮部
    ctx.beginPath();
    ctx.moveTo(cx, cy - R);
    if (sinPhi >= 0) {
      ctx.arc(cx, cy, R, -Math.PI/2, Math.PI/2, false);
    } else {
      ctx.arc(cx, cy, R, -Math.PI/2, Math.PI/2, true);
    }
    var aAbs = Math.max(Math.abs(aRad), 0.01);
    var ellipseDir = sinPhi >= 0 ? (aRad < 0) : (aRad > 0);
    ctx.ellipse(cx, cy, aAbs, R, 0, Math.PI/2, -Math.PI/2, ellipseDir);
    ctx.closePath();
    ctx.fillStyle = '#e6e6ef';
    ctx.fill();

    // 陨石坑
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, 0, TAU);
    ctx.clip();
    drawCraters(cx, cy, R, 0.3);
    ctx.restore();
  }

  function drawCraters(cx, cy, R, maxAlpha) {
    for (var i = 0; i < 6; i++) {
      var ang = pseudo(i * 7.3) * TAU;
      var rr = pseudo(i * 11.7) * 0.7;
      var px = cx + Math.cos(ang) * rr * R;
      var py = cy + Math.sin(ang) * rr * R;
      var pr = (0.05 + pseudo(i * 3.1) * 0.08) * R;
      ctx.fillStyle = 'rgba(90, 90, 110, ' + maxAlpha + ')';
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, TAU);
      ctx.fill();
    }
  }

  function drawMoonTopView(x, y, R) {
    ctx.beginPath();
    ctx.arc(x, y, R, 0, TAU);
    ctx.fillStyle = '#10101a';
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R, -Math.PI/2, Math.PI/2, false);
    ctx.closePath();
    ctx.clip();
    var g = ctx.createLinearGradient(x, y, x + R, y);
    g.addColorStop(0, '#c8c8d8');
    g.addColorStop(0.5, '#ececf5');
    g.addColorStop(1, '#ffffff');
    ctx.fillStyle = g;
    ctx.fillRect(x - R, y - R, R * 2, R * 2);
    ctx.restore();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R, 0, TAU);
    ctx.clip();
    for (var i = 0; i < 5; i++) {
      var ang = pseudo(i * 3.1 + 2) * TAU;
      var rr = pseudo(i * 5.7 + 2) * 0.75;
      var px = x + Math.cos(ang) * rr * R;
      var py = y + Math.sin(ang) * rr * R;
      var pr = (0.06 + pseudo(i * 7.3 + 2) * 0.09) * R;
      ctx.fillStyle = 'rgba(70, 70, 90, 0.35)';
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawEarthTopView(x, y, R) {
    ctx.beginPath();
    ctx.arc(x, y, R, 0, TAU);
    ctx.fillStyle = '#0a1420';
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, R, -Math.PI/2, Math.PI/2, false);
    ctx.closePath();
    ctx.clip();
    var g = ctx.createLinearGradient(x, y, x + R, y);
    g.addColorStop(0, '#1a4a80');
    g.addColorStop(0.5, '#3a7bd5');
    g.addColorStop(1, '#6ac0f0');
    ctx.fillStyle = g;
    ctx.fillRect(x - R, y - R, R * 2, R * 2);

    for (var i = 0; i < 4; i++) {
      var ang = pseudo(i * 3.3 + 5) * TAU;
      var rr = pseudo(i * 5.7 + 5) * 0.7;
      var px = x + Math.cos(ang) * rr * R;
      var py = y + Math.sin(ang) * rr * R;
      if (px > x - R * 0.2) {
        ctx.fillStyle = 'rgba(60, 140, 90, 0.65)';
        ctx.beginPath();
        ctx.ellipse(px, py, R * 0.2, R * 0.13, ang, 0, TAU);
        ctx.fill();
      }
    }
    ctx.restore();
  }

  function drawSunGlow() {
    var g = ctx.createRadialGradient(leftW + 20, cssH * 0.5, 30, leftW + 20, cssH * 0.5, leftW * 0.9);
    g.addColorStop(0, 'rgba(255, 230, 150, 0.55)');
    g.addColorStop(0.4, 'rgba(255, 190, 80, 0.15)');
    g.addColorStop(1, 'rgba(255, 150, 50, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, leftW + 40, cssH);

    ctx.beginPath();
    ctx.arc(leftW + 40, cssH * 0.5, 26, Math.PI * 0.5, Math.PI * 1.5, false);
    ctx.fillStyle = 'rgba(255, 220, 120, 0.7)';
    ctx.fill();

    ctx.beginPath();
    ctx.arc(leftW + 40, cssH * 0.5, 20, Math.PI * 0.5, Math.PI * 1.5, false);
    ctx.fillStyle = '#ffe9a0';
    ctx.fill();
  }

  function drawSunRays(TH) {
    if (!showRay) return;
    ctx.strokeStyle = withAlpha(TH.ray3, 0.55);
    ctx.lineWidth = 1.4;
    ctx.setLineDash([10, 7]);
    for (var y = 30; y < cssH - 20; y += 34) {
      ctx.beginPath();
      ctx.moveTo(leftW + 30, y);
      ctx.lineTo(40, y);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    ctx.fillStyle = withAlpha(TH.ray3, 0.7);
    for (var y = 30; y < cssH - 20; y += 34) {
      ctx.beginPath();
      ctx.moveTo(40, y);
      ctx.lineTo(52, y - 5);
      ctx.lineTo(52, y + 5);
      ctx.closePath();
      ctx.fill();
    }
  }

  function drawSolarEclipseShadows(TH) {
    var theta = 0;
    var mx = earthX + Math.cos(theta) * orbitR;
    var my = earthY - Math.sin(theta) * orbitR;

    // 半影锥
    ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
    ctx.beginPath();
    ctx.moveTo(mx - moonR, my - moonR);
    ctx.lineTo(mx - moonR, my + moonR);
    ctx.lineTo(earthX - earthR * 3.5, earthY + earthR * 1.8);
    ctx.lineTo(earthX - earthR * 3.5, earthY - earthR * 1.8);
    ctx.fill();

    // 本影锥（收敛到地球表面）
    ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
    ctx.beginPath();
    ctx.moveTo(mx - moonR, my - moonR);
    ctx.lineTo(mx - moonR, my + moonR);
    ctx.lineTo(earthX - earthR * 1.5, earthY);
    ctx.fill();

    // 投射在地球表面的黑斑
    ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
    ctx.beginPath();
    ctx.arc(earthX + earthR * 0.4, earthY, earthR * 0.55, 0, TAU);
    ctx.fill();

    ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.9);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('本影', (mx + earthX) / 2, my - moonR * 2.2);
    ctx.fillText('半影', (mx + earthX) / 2, my + moonR * 2.8);
  }

  function drawLunarEclipseShadows(TH) {
    var theta = Math.PI;
    var mx = earthX + Math.cos(theta) * orbitR;
    var my = earthY - Math.sin(theta) * orbitR;

    // 地球半影锥
    ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
    ctx.beginPath();
    ctx.moveTo(earthX - earthR, earthY - earthR);
    ctx.lineTo(earthX - earthR, earthY + earthR);
    ctx.lineTo(mx - moonR * 2.5, my + moonR * 2.5);
    ctx.lineTo(mx - moonR * 2.5, my - moonR * 2.5);
    ctx.fill();

    // 地球本影锥
    ctx.fillStyle = 'rgba(80, 15, 15, 0.75)';
    ctx.beginPath();
    ctx.moveTo(earthX - earthR, earthY - earthR);
    ctx.lineTo(earthX - earthR, earthY + earthR);
    ctx.lineTo(mx - moonR * 2, my + moonR * 0.8);
    ctx.lineTo(mx - moonR * 2, my - moonR * 0.8);
    ctx.fill();

    ctx.font = '11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.9);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('地球本影', (earthX + mx) / 2, my - earthR * 1.5);
  }

  function drawTopView(TH) {
    drawSunGlow();
    drawSunRays(TH);

    if (showOrbit) {
      ctx.strokeStyle = withAlpha(TH.normal, 0.35);
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.arc(earthX, earthY, orbitR, 0, TAU);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    var theta = getPhaseAngle(age);
    var mx, my;

    if (mode === 'solar') {
      theta = 0;
      mx = earthX + Math.cos(theta) * orbitR;
      my = earthY - Math.sin(theta) * orbitR;
      drawSolarEclipseShadows(TH);
    } else if (mode === 'lunar') {
      theta = Math.PI;
      mx = earthX + Math.cos(theta) * orbitR;
      my = earthY - Math.sin(theta) * orbitR;
      drawLunarEclipseShadows(TH);
    } else {
      mx = earthX + Math.cos(theta) * orbitR;
      my = earthY - Math.sin(theta) * orbitR;
    }

    if (showLine) {
      ctx.strokeStyle = withAlpha(TH.ray3, 0.3);
      ctx.lineWidth = 1;
      ctx.setLineDash([3, 4]);
      ctx.beginPath();
      ctx.moveTo(earthX + earthR, earthY);
      ctx.lineTo(leftW + 40, earthY);
      ctx.stroke();

      ctx.strokeStyle = withAlpha(TH.ray2, 0.55);
      ctx.beginPath();
      ctx.moveTo(earthX, earthY);
      ctx.lineTo(mx, my);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    drawEarthTopView(earthX, earthY, earthR);

    if (mode === 'lunar') {
      var dist = Math.abs((eclipseProgress - 0.5) * 4 * rightR);
      var shadowR = rightR * 1.1;
      var moonR2 = rightR * 0.85;
      var isPartial = dist < shadowR + moonR2;
      var isTotal = dist < shadowR - moonR2;

      drawMoonTopView(mx, my, moonR);
      if (isPartial) {
        ctx.save();
        ctx.beginPath();
        ctx.arc(mx, my, moonR, 0, TAU);
        ctx.clip();
        ctx.fillStyle = isTotal ? 'rgba(120, 25, 15, 0.85)' : 'rgba(120, 25, 15, 0.4)';
        ctx.fillRect(mx - moonR, my - moonR, moonR * 2, moonR * 2);
        ctx.restore();
      }
    } else {
      drawMoonTopView(mx, my, moonR);
    }

    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.95);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('地球', earthX, earthY + earthR + 18);

    ctx.font = 'bold 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#e8e8f0';
    ctx.fillText('月球', mx, my + moonR + 16);

    ctx.font = 'bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.ray3, 0.95);
    ctx.textAlign = 'right';
    ctx.fillText('☀ 太阳方向', leftW + 34, 22);
  }

  function drawRightPhase(TH) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(leftW, 0, rightW, cssH);
    ctx.clip();

    ctx.strokeStyle = withAlpha(TH.normal, 0.15);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(leftW, 20);
    ctx.lineTo(leftW, cssH - 20);
    ctx.stroke();

    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.85);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('从地球看到的月相', rightCx, 30);

    drawMoonPhaseAt(rightCx, rightCy, rightR, age);

    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = '#e8e8f0';
    ctx.fillText(getPhaseName(age), rightCx, rightCy + rightR + 32);

    var illum = getIllumination(age) * 100;
    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.8);
    ctx.fillText('照亮 ' + illum.toFixed(1) + '%', rightCx, rightCy + rightR + 52);
    ctx.restore();
  }

  function drawRightSolar(TH) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(leftW, 0, rightW, cssH);
    ctx.clip();

    ctx.strokeStyle = withAlpha(TH.normal, 0.15);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(leftW, 20);
    ctx.lineTo(leftW, cssH - 20);
    ctx.stroke();

    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.85);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('地面观测到的太阳', rightCx, 30);

    var sunR = rightR * 0.62;
    var moonR2 = rightR * 0.64;

    var glow = ctx.createRadialGradient(rightCx, rightCy, sunR * 0.8, rightCx, rightCy, sunR * 2.5);
    glow.addColorStop(0, 'rgba(255, 220, 100, 0.5)');
    glow.addColorStop(0.5, 'rgba(255, 180, 60, 0.15)');
    glow.addColorStop(1, 'rgba(255, 150, 40, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(rightCx, rightCy, sunR * 2.5, 0, TAU);
    ctx.fill();

    var sunG = ctx.createRadialGradient(rightCx - sunR * 0.3, rightCy - sunR * 0.3, sunR * 0.1, rightCx, rightCy, sunR);
    sunG.addColorStop(0, '#fff5c8');
    sunG.addColorStop(0.7, '#ffcc55');
    sunG.addColorStop(1, '#ffaa22');
    ctx.beginPath();
    ctx.arc(rightCx, rightCy, sunR, 0, TAU);
    ctx.fillStyle = sunG;
    ctx.fill();

    // 真实距离判断（0~1映射，0.5时完全重叠）
    var offset = (0.5 - eclipseProgress) * 5 * sunR;
    var moonX = rightCx + offset;
    var moonY = rightCy;

    // 月球
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonR2, 0, TAU);
    ctx.fillStyle = '#0a0a12';
    ctx.fill();

    var dist = Math.abs(offset);
    var state = '';
    if (dist < sunR * 0.1) state = '日全食';
    else if (dist < sunR + moonR2 * 0.9) state = '日偏食';
    else state = '未发生日食';

    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = state === '日全食' ? '#ffaa22' : '#e8e8f0';
    ctx.fillText(state, rightCx, rightCy + sunR + 34);

    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.8);
    ctx.fillText('进度 ' + Math.round(eclipseProgress * 100) + '%', rightCx, rightCy + sunR + 54);
    ctx.restore();
  }

  function drawRightLunar(TH) {
    ctx.save();
    ctx.beginPath();
    ctx.rect(leftW, 0, rightW, cssH);
    ctx.clip();

    ctx.strokeStyle = withAlpha(TH.normal, 0.15);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(leftW, 20);
    ctx.lineTo(leftW, cssH - 20);
    ctx.stroke();

    ctx.font = 'bold 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.85);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('地面观测到的月亮', rightCx, 30);

    var moonR2 = rightR * 0.85;

    var g = ctx.createRadialGradient(rightCx - moonR2 * 0.2, rightCy - moonR2 * 0.2, moonR2 * 0.1, rightCx, rightCy, moonR2);
    g.addColorStop(0, '#f5f5ff');
    g.addColorStop(0.7, '#d8d8e0');
    g.addColorStop(1, '#9a9aae');
    ctx.beginPath();
    ctx.arc(rightCx, rightCy, moonR2, 0, TAU);
    ctx.fillStyle = g;
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(rightCx, rightCy, moonR2, 0, TAU);
    ctx.clip();
    drawCraters(rightCx, rightCy, moonR2, 0.4);
    ctx.restore();

    var shadowR = rightR * 1.1;
    var shadowOff = (0.5 - eclipseProgress) * 4 * rightR;
    var shadowX = rightCx + shadowOff;

    ctx.save();
    ctx.beginPath();
    ctx.arc(rightCx, rightCy, moonR2, 0, TAU);
    ctx.clip();
    ctx.beginPath();
    ctx.arc(shadowX, rightCy, shadowR, 0, TAU);
    ctx.fillStyle = 'rgba(110, 25, 18, 0.88)';
    ctx.fill();
    ctx.restore();

    var dist = Math.abs(shadowOff);
    var state = '';
    if (dist < shadowR - moonR2) state = '月全食（血月）';
    else if (dist < shadowR + moonR2) state = '月偏食';
    else state = '未发生月食';

    ctx.font = 'bold 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = state.indexOf('全食') >= 0 ? '#c0392b' : '#e8e8f0';
    ctx.fillText(state, rightCx, rightCy + moonR2 + 34);

    ctx.font = '12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
    ctx.fillStyle = withAlpha(TH.normal, 0.8);
    ctx.fillText('进度：' + Math.round(eclipseProgress * 100) + '%', rightCx, rightCy + moonR2 + 54);
    ctx.restore();
  }

  function draw() {
    var TH = App.getTheme();

    ctx.fillStyle = '#0a0e1a';
    ctx.fillRect(0, 0, cssW, cssH);

    ctx.fillStyle = '#ffffff';
    for (var i = 0; i < 90; i++) {
      var sx = pseudo(i * 3.7 + 1) * cssW;
      var sy = pseudo(i * 5.3 + 1) * cssH;
      var sr = 0.5 + pseudo(i * 7.1 + 1) * 1;
      var sa = 0.15 + pseudo(i * 9.7 + 1) * 0.35;
      ctx.globalAlpha = sa;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawTopView(TH);

    if (mode === 'phase') drawRightPhase(TH);
    else if (mode === 'solar') drawRightSolar(TH);
    else if (mode === 'lunar') drawRightLunar(TH);
  }

  function updateReadout() {
    var html = '';

    if (mode === 'phase') {
      var phi = getPhaseAngle(age);
      var deg = (phi * 180 / Math.PI).toFixed(1);
      var illum = getIllumination(age) * 100;
      var name = getPhaseName(age);
      html += '月龄：<b>' + age.toFixed(2) + '</b> 天<br>';
      html += '相位角：<b>' + deg + '°</b><br>';
      html += '照亮比例：<b>' + illum.toFixed(1) + '%</b><br>';
      html += '月相：<b>' + name + '</b>';
    } else if (mode === 'solar') {
      var offset = (0.5 - eclipseProgress) * 5 * 1; // 简化距离
      var dist = Math.abs(offset);
      var st = '';
      if (dist < 0.1 * 5) st = '日全食';
      else if (dist < 2.0) st = '日偏食';
      else st = '未发生日食';

      html += '现象：<b>' + st + '</b><br>';
      html += '进度：<b>' + Math.round(eclipseProgress * 100) + '%</b><br>';
      html += '月球位于日地之间<br>';
      html += '<span style="color:#f59e0b;">⚠ 直接观测会灼伤眼睛</span>';
    } else if (mode === 'lunar') {
      var shadowOff = (0.5 - eclipseProgress) * 4;
      var dist2 = Math.abs(shadowOff);
      var st2 = '';
      if (dist2 < 1.1 - 0.85) st2 = '月全食';
      else if (dist2 < 1.1 + 0.85) st2 = '月偏食';
      else st2 = '未发生月食';

      html += '现象：<b>' + st2 + '</b><br>';
      html += '进度：<b>' + Math.round(eclipseProgress * 100) + '%</b><br>';
      html += '月球进入地球本影<br>';
      html += '<span style="color:#22c55e;">✓ 可直接肉眼观测</span>';
    }
    readoutEl.innerHTML = html;

    if (mode === 'phase') {
      var idx = getPhaseIndex(age);
      var rows = document.querySelectorAll('#caseTable tbody tr');
      for (var i = 0; i < rows.length; i++) {
        rows[i].classList.toggle('active', i === idx);
      }
    } else {
      var rows2 = document.querySelectorAll('#caseTable tbody tr');
      for (var j = 0; j < rows2.length; j++) {
        rows2[j].classList.remove('active');
      }
    }
  }

  // 拖拽
  var dragging = false;
  var activePointer = null;

  function getMoonPos() {
    var theta = getPhaseAngle(age);
    return [earthX + Math.cos(theta) * orbitR, earthY - Math.sin(theta) * orbitR];
  }

  function updateMoonFromPointer(px, py) {
    var dx = px - earthX;
    var dy = -(py - earthY);
    var theta = Math.atan2(dy, dx);
    if (theta < 0) theta += TAU;
    age = (theta / TAU) * SYNODIC;
    if (age < 0) age = 0;
    if (age >= SYNODIC) age = SYNODIC - 0.001;
    savedPhaseAge = age;
    ageRangeEl.value = age;
    ageValEl.textContent = age.toFixed(2);
  }

  canvas.addEventListener('pointerdown', function(e){
    if (mode !== 'phase') return;
    if (activePointer !== null) return;
    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    if (px > leftW) return;
    var mp = getMoonPos();
    var dist = Math.hypot(px - mp[0], py - mp[1]);
    if (dist < Math.max(moonR * 2.8, 28)) {
      dragging = true;
      activePointer = e.pointerId;
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      playing = false;
      document.getElementById('playBtn').textContent = '▶ 播放';
      updateMoonFromPointer(px, py);
    }
  });

  canvas.addEventListener('pointermove', function(e){
    if (!dragging || e.pointerId !== activePointer) return;
    var rect = canvas.getBoundingClientRect();
    updateMoonFromPointer(e.clientX - rect.left, e.clientY - rect.top);
  });

  function endPointer(e) {
    if (e.pointerId !== activePointer) return;
    dragging = false;
    activePointer = null;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  ageRangeEl.addEventListener('input', function(e){
    age = parseFloat(e.target.value);
    savedPhaseAge = age;
    ageValEl.textContent = age.toFixed(2);
    playing = false;
    document.getElementById('playBtn').textContent = '▶ 播放';
  });

  document.getElementById('speedRange').addEventListener('input', function(e){
    speed = parseFloat(e.target.value);
    speedValEl.textContent = speed.toFixed(1);
  });

  document.getElementById('eclSpeedRange').addEventListener('input', function(e){
    eclipseSpeed = parseFloat(e.target.value);
    document.getElementById('eclSpeedVal').textContent = eclipseSpeed.toFixed(1);
  });

  document.getElementById('rayToggle').addEventListener('change', function(e){ showRay = e.target.checked; });
  document.getElementById('orbitToggle').addEventListener('change', function(e){ showOrbit = e.target.checked; });
  document.getElementById('lineToggle').addEventListener('change', function(e){ showLine = e.target.checked; });

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function(){
    playing = !playing;
    playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', function(){
    age = 7.4;
    savedPhaseAge = 7.4;
    eclipseProgress = 0;
    eclipseDir = 1;
    playing = true;
    speed = 1;
    eclipseSpeed = 1;
    ageRangeEl.value = age;
    ageValEl.textContent = age.toFixed(2);
    document.getElementById('speedRange').value = 1;
    speedValEl.textContent = '1.0';
    document.getElementById('eclSpeedRange').value = 1;
    document.getElementById('eclSpeedVal').textContent = '1.0';
    playBtn.textContent = '⏸ 暂停';
  });

  var tabs = document.querySelectorAll('.mode-tab');
  tabs.forEach(function(tab){
    tab.addEventListener('click', function(){
      var newMode = tab.getAttribute('data-mode');
      if (newMode === mode) return;

      if (mode === 'phase') savedPhaseAge = age;

      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');

      mode = newMode;
      eclipseProgress = 0;
      eclipseDir = 1;
      playing = true;
      playBtn.textContent = '⏸ 暂停';

      if (mode === 'phase') {
        age = savedPhaseAge;
        ageRangeEl.value = age;
        ageValEl.textContent = age.toFixed(2);
        document.getElementById('phaseControls').style.display = '';
        document.getElementById('eclipseControls').style.display = 'none';
        document.getElementById('speedControl').style.display = '';
        document.getElementById('orbitControl').style.display = '';
        document.getElementById('lineControl').style.display = '';
        document.getElementById('navHint').textContent = '💡 可拖拽画布中的月球改变月相';
      } else {
        document.getElementById('phaseControls').style.display = 'none';
        document.getElementById('eclipseControls').style.display = '';
        document.getElementById('speedControl').style.display = 'none';
        document.getElementById('orbitControl').style.display = 'none';
        document.getElementById('lineControl').style.display = 'none';
        document.getElementById('navHint').textContent = '💡 自动循环演示中，可调节速度';
      }

      updateInfoPanel();
    });
  });

  var INFO = {
    phase: {
      title: '月相变化的原理',
      body: '<p>月相是指从地球上看月球被太阳照亮的半球所呈现的形状变化。月球本身不发光，我们看到的月光是月球反射的太阳光。由于日、地、月三者相对位置不断变化，月球被照亮的半球朝向地球的部分也在不断改变，形成了我们看到的月相周期变化。</p>' +
        '<p>在一个朔望月（约 29.53 天）中，月相依次经历：<span class="highlight">新月（朔）、蛾眉月、上弦月、盈凸月、满月（望）、亏凸月、下弦月、残月</span>，最后回到新月。新月时月球位于地球和太阳之间，被照亮的半球背对地球，从地球上看不到月亮；满月时地球位于月球和太阳之间，月球被完全照亮的一面朝向地球，此时月亮呈明亮的圆形。</p>' +
        '<p>在上弦月（月龄约 7.4 天）时，从地球看月亮呈"右半亮、左半暗"的半月形状，此时月球、地球、太阳形成一个直角，月球位于太阳东侧 90°。下弦月（月龄约 22 天）时则相反，呈"左半亮、右半暗"的形状。</p>' +
        '<p>值得注意的是，月相变化与月食不同：<span class="highlight">月相是正常的光照几何关系，每月都会如期发生</span>；而月食需要月球恰好运行到地球影子里，这要满足日地月严格共线，因此并不常见。此外，北半球和南半球看到的月相"方向"不同——北半球看到的盈月是右亮，而南半球则是左亮，这与观测者的朝向有关。</p>' +
        '<p>月亮每天升起的时间也不同：新月与太阳同升同落，上弦月中午升起、午夜落下，满月傍晚升起、清晨落下，下弦月午夜升起、中午落下。这也解释了为什么我们有时能在白天看到月亮。</p>'
    },
    solar: {
      title: '日食的形成与演示',
      body: '<p>日食发生在月球运行到太阳和地球之间，且三者严格共线时。此时<span class="highlight">月球遮挡住太阳射向地球的光</span>，使地球上部分地区的人们看到太阳被部分或完全遮住的现象。</p>' +
        '<p>日食分为三种类型：<span class="highlight">日全食</span>（月球完全遮住太阳，观测者处于月球本影区）、<span class="highlight">日环食</span>（月球看起来比太阳小，边缘露出环形光晕，观测者处于月球伪本影区）、<span class="highlight">日偏食</span>（观测者处于月球半影区，太阳部分被遮挡）。日全食时天空骤然变暗，肉眼可见太阳日冕层和闪烁的恒星。</p>' +
        '<p>由于月球轨道面相对于地球轨道面（黄道面）倾斜约 5°，因此<span class="highlight">并不是每个新月都会发生日食</span>，只有当新月恰逢月球位于黄道面附近时才会出现。日食发生时，地球上不同位置的人们看到的景象不同，同一时间有些地方看到日全食，有些地方只看到日偏食，还有一些地方完全看不到。</p>' +
        '<p>日食带宽度通常只有几十到几百千米，持续时间也只有几分钟，因此能观测到日全食是非常难得的体验。1922 年、2009 年、2024 年的日全食都曾引起全球天文爱好者的关注。</p>' +
        '<p><span class="highlight">⚠ 重要安全提醒：</span>观测日食时，绝对不能用肉眼或望远镜直接注视太阳，必须使用专业的太阳观测镜（如巴德膜）或通过投影法观测。普通的墨镜、烟熏玻璃、X 光片都无法有效过滤太阳的紫外线和红外线辐射，会造成不可逆的视网膜灼伤。</p>'
    },
    lunar: {
      title: '月食的形成与演示',
      body: '<p>月食发生在满月时，地球位于太阳和月球之间，且三者严格共线。此时<span class="highlight">地球挡住了太阳射向月球的光</span>，月球进入地球的影子中，从地球上看到月亮逐渐变暗甚至完全消失。</p>' +
        '<p>月食分为三种类型：<span class="highlight">月全食</span>（月球完全进入地球本影，此时月球呈暗红色，即著名的"血月"）、<span class="highlight">月偏食</span>（月球部分进入地球本影，一部分变暗）、<span class="highlight">半影月食</span>（月球只进入地球半影，亮度略有下降但肉眼难以察觉）。</p>' +
        '<p>月全食时月球呈现血红色，原因在于：太阳光经过地球大气层时，波长较短的蓝光、紫光被大气散射掉，只有波长较长的<span class="highlight">红光被折射到月球表面</span>。这正是我们在日出日落时看到的红色天空的同一原理——都是瑞利散射作用。</p>' +
        '<p>和日食一样，由于月球轨道倾角约 5°，<span class="highlight">并不是每个满月都会发生月食</span>。但由于地球体积远大于月球，地球影子的锥面积也远大于月球影子，所以月食的发生频率比日食高一些。</p>' +
        '<p>月食的观测范围比日食大得多——当地球夜半球上的人们（约占全球一半人口）都能同时看到月食，而日食的观测者只限于狭窄的日食带内。更重要的是，<span class="highlight">月食观测不需要任何防护设备</span>，直接用肉眼就可以安全观看，也可以用手机或相机拍摄，是一次完美的天文观测机会。</p>' +
        '<p>我国古代将"月食"称为"天狗食月"，并在《诗经》中就有记载。现代天文学已经能够精确预测月食的发生时间和持续时间，例如 2025 年 3 月 14 日和 9 月 7 日都发生过月全食。</p>'
    }
  };

  function updateInfoPanel() {
    var info = INFO[mode];
    document.getElementById('infoTitle').textContent = info.title;
    document.getElementById('infoBody').innerHTML = info.body;
  }

  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;
    if (!isFinite(dt) || dt < 0) dt = 0;

    if (playing && !dragging) {
      if (mode === 'phase') {
        age += dt * speed;
        if (age >= SYNODIC) age -= SYNODIC;
        if (age < 0) age = 0;
        savedPhaseAge = age;
        ageRangeEl.value = age;
        ageValEl.textContent = age.toFixed(2);
      } else {
        eclipseProgress += dt * eclipseSpeed * 0.25 * eclipseDir;
        if (eclipseProgress > 1) {
          eclipseProgress = 1;
          eclipseDir = -1;
        } else if (eclipseProgress < 0) {
          eclipseProgress = 0;
          eclipseDir = 1;
        }
      }
    }

    if (!isFinite(age)) age = 0;
    if (!isFinite(eclipseProgress)) eclipseProgress = 0;
    if (!isFinite(orbitR) || orbitR <= 0) resize();

    draw();
    updateReadout();
  }

  resize();
  updateInfoPanel();
  requestAnimationFrame(frame);
})();
</script>
</body>
