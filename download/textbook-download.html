<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<link rel="icon" type="image/png" href="../shared/new-icon.png">
<link rel="stylesheet" href="../shared/style.css">
<style>
  /* 页面容器限制最大宽度，保证在大屏上也不过分拉伸 */
  .download-container {
    max-width: 720px;
    margin: 40px auto;
    padding: 0 20px;
  }

  .header-title {
    text-align: center;
    margin-bottom: 40px;
  }
  
  .header-title h2 {
    color: #1e293b;
    font-size: 24px;
    margin-bottom: 8px;
  }

  .header-title p {
    color: #64748b;
    font-size: 14px;
  }

  /* 卡片基础样式 */
  .dl-card {
    display: block;
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    text-decoration: none;
    color: #333;
    transition: all 0.3s ease;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
    position: relative;
    overflow: hidden;
  }

  .dl-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 20px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    border-color: #cbd5e1;
  }

  /* 品牌色边框点缀 */
  .dl-card.quark { border-left: 6px solid #1e88e5; }
  .dl-card.pep { border-left: 6px solid #e53935; }
  .dl-card.smartedu { border-left: 6px solid #43a047; }

  .dl-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
    flex-wrap: wrap;
    gap: 12px;
  }

  .dl-title {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 18px;
    font-weight: bold;
    color: #0f172a;
  }

  /* 标签 */
  .dl-tag {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: bold;
  }
  .dl-tag.official {
    background: #e8f5e9;
    color: #2e7d32;
    border: 1px solid #a5d6a7;
  }
  .dl-tag.third-party {
    background: #fff3e0;
    color: #e65100;
    border: 1px solid #ffcc80;
  }

  /* 描述文字 */
  .dl-desc {
    font-size: 14px;
    color: #475569;
    line-height: 1.6;
    margin-bottom: 8px;
  }

  /* 右下角箭头提示 */
  .dl-arrow {
    position: absolute;
    bottom: 20px;
    right: 24px;
    color: #cbd5e1;
    font-size: 20px;
    transition: color 0.3s ease, transform 0.3s ease;
  }

  .dl-card:hover .dl-arrow {
    color: #3b82f6;
    transform: translateX(4px);
  }

  @media (max-width: 600px) {
    .download-container {
      margin: 20px auto;
    }
    .dl-card {
      padding: 20px;
    }
    .dl-title {
      font-size: 16px;
    }
    .dl-arrow {
      display: none;
    }
  }
</style>
</head>
<body>

</div>
