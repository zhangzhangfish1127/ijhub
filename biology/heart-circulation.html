  .stage canvas { touch-action: none; }
  .lab-main { display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; }

    font-size: 12px;
    color: #94a3b8;

<body>
<a class="back" href="../index.html">← 返回主页</a>
<h1>心脏与血液循环</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>循环类型</th><th>起点</th><th>终点</th><th>血液变化</th></tr></thead>
    <tbody>
      <tr data-id="systemic"><td>体循环</td><td>左心室</td><td>右心房</td><td>动脉血 → 静脉血</td></tr>
      <tr data-id="pulmonary"><td>肺循环</td><td>右心室</td><td>左心房</td><td>静脉血 → 动脉血</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <label>心率 = <span id="bpmVal">75</span> 次/分
    <input type="range" id="bpmRange" min="40" max="150" value="75" step="1">
  </label>

  <div class="row"><input type="checkbox" id="labelToggle" checked><label for="labelToggle" style="margin:0">显示器官名称</label></div>
  <div class="row"><input type="checkbox" id="valveToggle" checked><label for="valveToggle" style="margin:0">显示瓣膜</label></div>
  <div class="row"><input type="checkbox" id="flowToggle" checked><label for="flowToggle" style="margin:0">显示血液流动</label></div>

  <button id="playBtn">⏸ 暂停</button>
  <button id="resetBtn" class="secondary">↺ 重置视角</button>

  <div class="readout" id="readout">
    点击画布中的心脏腔室或器官<br>可以查看详细说明<br><br>
    <b>提示：</b>观察血液流经肺部与全身时的颜色变化。
  </div>
  <div class="nav-hint">💡 支持双指缩放与拖拽平移</div>
</aside>

<main class="lab-main">
  <div class="stage">
    <canvas id="cv" style="aspect-ratio:16/10"></canvas>
  </div>
</main>
</div>

<div class="site-footer">

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  var cssW = 800, cssH = 500, dpr = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var targetView = { cx: 0, cy: 0, scale: 1 };
  
  var bpm = 75;
  var playing = true;
  var showLabel = true;
  var showValve = true;
  var showFlow = true;
  var activeSelection = null; // 'systemic' or 'pulmonary' or 'LA' etc.

  var beatPhase = 0; // 0 to 1, 1 cycle
  
  // 颜色定义 (生理学标准色)
  var COLOR_OXY = '#e74c3c';      // 富氧血（鲜红）
  var COLOR_DEOXY = '#3498db';    // 缺氧血（暗蓝紫）
  var COLOR_HEART = '#ff9999';    // 心肌
  var COLOR_LUNG = '#f5b0b0';     // 肺
  var COLOR_BODY = '#ffd59a';     // 全身组织

  // 解剖结构布局 (以中心为原点)
  var layout = {
    heartX: 0, heartY: 50,
    lungX: -200, lungY: -80,
    bodyX: 200, bodyY: 150,
    // 心脏四腔室的中心点及尺寸
    RA: { x: -25, y: -10, w: 40, h: 40 }, // 右心房 (屏幕左侧)
    RV: { x: -25, y: 40, w: 45, h: 50 },  // 右心室
    LA: { x: 25, y: -10, w: 40, h: 40 },  // 左心房 (屏幕右侧)
    LV: { x: 25, y: 40, w: 45, h: 50 }    // 左心室
  };

  // 血液流动路线 (样条节点)
  var paths = {
    venaCava: [ {x: 200, y: 150}, {x: 120, y: 120}, {x: 0, y: 120}, {x: -25, y: -10} ], // 上/下腔静脉 -> 右心房
    rightVentricle: [ {x: -25, y: -10}, {x: -25, y: 40} ], // 右心房 -> 右心室
    pulmonaryArtery: [ {x: -25, y: 40}, {x: -60, y: -20}, {x: -150, y: -60}, {x: -200, y: -80} ], // 右心室 -> 肺动脉 -> 肺
    pulmonaryVein: [ {x: -200, y: -80}, {x: -100, y: -150}, {x: 0, y: -120}, {x: 25, y: -10} ], // 肺 -> 肺静脉 -> 左心房
    leftVentricle: [ {x: 25, y: -10}, {x: 25, y: 40} ], // 左心房 -> 左心室
    aorta: [ {x: 25, y: 40}, {x: 70, y: 0}, {x: 120, y: 100}, {x: 200, y: 150} ] // 左心室 -> 主动脉 -> 全身
  };

  // 粒子系统
  var particles = [];
  var MAX_PARTICLES = 120;

  function initParticles() {
    particles = [];
    for (var i = 0; i < MAX_PARTICLES; i++) {
      resetParticle({}, true);
    }
  }

  function resetParticle(p, isInit) {
    // 平均分布到 6 条路线上
    var pathKeys = Object.keys(paths);
    var pIdx = Math.floor(Math.random() * pathKeys.length);
    var key = pathKeys[pIdx];
    
    p.pathKey = key;
    p.progress = isInit ? Math.random() : 0;
    p.speed = 0.8 + Math.random() * 0.4; // 速度抖动
    p.oxy = (key === 'pulmonaryVein' || key === 'leftVentricle' || key === 'aorta');
    return p;
  }

  initParticles();

  // 贝塞尔曲线计算
  function getPointOnPath(path, t) {
    var n = path.length - 1;
    if (n === 0) return path[0];
    var seg = Math.floor(t * n);
    if (seg >= n) seg = n - 1;
    var localT = (t * n) - seg;
    var p0 = path[Math.max(0, seg - 1)];
    var p1 = path[seg];
    var p2 = path[seg + 1];
    var p3 = path[Math.min(n, seg + 2)];
    
    // Catmull-Rom 转 Bezier
    var cp1x = p1.x + (p2.x - p0.x) / 6;
    var cp1y = p1.y + (p2.y - p0.y) / 6;
    var cp2x = p2.x - (p3.x - p1.x) / 6;
    var cp2y = p2.y - (p3.y - p1.y) / 6;
    
    var x = Math.pow(1-localT, 3) * p1.x + 
            3 * Math.pow(1-localT, 2) * localT * cp1x + 
            3 * (1-localT) * Math.pow(localT, 2) * cp2x + 
            Math.pow(localT, 3) * p2.x;
    var y = Math.pow(1-localT, 3) * p1.y + 
            3 * Math.pow(1-localT, 2) * localT * cp1y + 
            3 * (1-localT) * Math.pow(localT, 2) * cp2y + 
            Math.pow(localT, 3) * p2.y;
            
    return { x: x, y: y };
  }

  function updateParticles(dt) {
    if (!playing || !showFlow) return;
    
    // 心率越快，流动越快，基础流速
    var flowSpeed = (bpm / 60) * 0.5;
    
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.progress += dt * flowSpeed * p.speed;
      
      if (p.progress >= 1) {
        // 到达终点，转移至下一个路径
        if (p.pathKey === 'venaCava') {
          p.pathKey = 'rightVentricle';
        } else if (p.pathKey === 'rightVentricle') {
          p.pathKey = 'pulmonaryArtery';
        } else if (p.pathKey === 'pulmonaryArtery') {
          p.pathKey = 'pulmonaryVein';
          p.oxy = true; // 肺部换气，变红
        } else if (p.pathKey === 'pulmonaryVein') {
          p.pathKey = 'leftVentricle';
        } else if (p.pathKey === 'leftVentricle') {
          p.pathKey = 'aorta';
        } else if (p.pathKey === 'aorta') {
          p.pathKey = 'venaCava';
          p.oxy = false; // 全身组织耗氧，变蓝
        }
        p.progress = 0;
      }
    }
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  function w2s(x, y) {
    return [cssW / 2 + (x - view.cx) * view.scale, cssH / 2 + (y - view.cy) * view.scale];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawPath(path, color, width) {
    if (path.length < 2) return;
    var p0 = w2s(path[0].x, path[0].y);
    ctx.beginPath();
    ctx.moveTo(p0[0], p0[1]);
    
    for (var i = 1; i < path.length - 1; i++) {
      var p1 = w2s(path[i].x, path[i].y);
      var p2 = w2s(path[i+1].x, path[i+1].y);
      var midX = (p1[0] + p2[0]) / 2;
      var midY = (p1[1] + p2[1]) / 2;
      ctx.quadraticCurveTo(p1[0], p1[1], midX, midY);
    }
    var pLast = w2s(path[path.length-1].x, path[path.length-1].y);
    ctx.lineTo(pLast[0], pLast[1]);
    
    ctx.strokeStyle = color;
    ctx.lineWidth = width * view.scale;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();
  }

  function drawHeart() {
    var hCenter = w2s(layout.heartX, layout.heartY);
    
    // 心跳缩放
    var heartBeatScale = 1;
    if (playing) {
      // 模拟收缩期(Systole)和舒张期(Diastole)，收缩较快
      var t = beatPhase % 1;
      if (t < 0.15) heartBeatScale = 1 + 0.08 * Math.sin(t / 0.15 * Math.PI);
      else heartBeatScale = 1;
    }
    
    ctx.save();
    ctx.translate(hCenter[0], hCenter[1]);
    ctx.scale(view.scale * heartBeatScale, view.scale * heartBeatScale);
    
    // 绘制心脏外形 (简单的圆润形状)
    ctx.beginPath();
    ctx.moveTo(-60, -60);
    ctx.bezierCurveTo(0, -80, 60, -60, 60, 0);
    ctx.bezierCurveTo(60, 60, 0, 90, 0, 90);
    ctx.bezierCurveTo(0, 90, -60, 60, -60, 0);
    ctx.bezierCurveTo(-60, -60, -60, -60, -60, -60);
    ctx.fillStyle = 'rgba(255, 153, 153, 0.2)';
    ctx.fill();
    ctx.strokeStyle = COLOR_HEART;
    ctx.lineWidth = 3;
    ctx.stroke();

    // 画四腔室 (用圆角矩形表示)
    function drawChamber(name, coords, color) {
      ctx.beginPath();
      ctx.ellipse(coords.x, coords.y, coords.w/2, coords.h/2, 0, 0, TAU);
      ctx.fillStyle = color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.4)';
      ctx.lineWidth = 1;
      ctx.stroke();

      if (showLabel) {
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px "PingFang SC", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(name, coords.x, coords.y);
      }
      
      if (activeSelection === name) {
        ctx.strokeStyle = App.getTheme().ray3;
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }

    // 血液充满时的颜色
    drawChamber('RA', layout.RA, COLOR_DEOXY); // 右心房
    drawChamber('RV', layout.RV, COLOR_DEOXY); // 右心室
    drawChamber('LA', layout.LA, COLOR_OXY);   // 左心房
    drawChamber('LV', layout.LV, COLOR_OXY);   // 左心室

    // 绘制瓣膜
    if (showValve) {
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 2;
      
      // 房室瓣 (RA-RV)
      var vOpen = heartBeatScale > 1.02; // 收缩时关闭，舒张时打开
      ctx.beginPath();
      if (vOpen) {
        ctx.moveTo(-25, 10); ctx.lineTo(-35, 20);
        ctx.moveTo(-25, 10); ctx.lineTo(-15, 20);
      } else {
        ctx.moveTo(-40, 15); ctx.lineTo(-10, 15);
      }
      ctx.stroke();

      // 房室瓣 (LA-LV)
      ctx.beginPath();
      if (vOpen) {
        ctx.moveTo(25, 10); ctx.lineTo(15, 20);
        ctx.moveTo(25, 10); ctx.lineTo(35, 20);
      } else {
        ctx.moveTo(10, 15); ctx.lineTo(40, 15);
      }
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawLung() {
    var lCenter = w2s(layout.lungX, layout.lungY);
    ctx.save();
    ctx.translate(lCenter[0], lCenter[1]);
    ctx.scale(view.scale, view.scale);

    // 肺叶
    ctx.beginPath();
    ctx.ellipse(-20, 0, 30, 50, Math.PI/6, 0, TAU);
    ctx.ellipse(20, 0, 30, 50, -Math.PI/6, 0, TAU);
    ctx.fillStyle = 'rgba(245, 176, 176, 0.3)';
    ctx.fill();
    ctx.strokeStyle = COLOR_LUNG;
    ctx.lineWidth = 3;
    ctx.stroke();

    if (showLabel) {
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 12px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('肺部', 0, -60);
      ctx.font = '10px "PingFang SC", sans-serif';
      ctx.fillText('(毛细血管网)', 0, -46);
    }
    
    if (activeSelection === 'Lung') {
      ctx.strokeStyle = App.getTheme().ray3;
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }

  function drawBody() {
    var bCenter = w2s(layout.bodyX, layout.bodyY);
    ctx.save();
    ctx.translate(bCenter[0], bCenter[1]);
    ctx.scale(view.scale, view.scale);

    // 全身组织
    ctx.beginPath();
    ctx.arc(0, 0, 40, 0, TAU);
    ctx.fillStyle = 'rgba(255, 213, 154, 0.3)';
    ctx.fill();
    ctx.strokeStyle = COLOR_BODY;
    ctx.lineWidth = 3;
    ctx.stroke();

    // 内部纹理
    ctx.fillStyle = 'rgba(255, 213, 154, 0.6)';
    for(var i=0; i<5; i++) {
      ctx.beginPath();
      ctx.arc(Math.sin(i*3)*15, Math.cos(i*5)*15, 8, 0, TAU);
      ctx.fill();
    }

    if (showLabel) {
      ctx.fillStyle = '#64748b';
      ctx.font = 'bold 12px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('全身组织', 0, 60);
      ctx.font = '10px "PingFang SC", sans-serif';
      ctx.fillText('(毛细血管网)', 0, 74);
    }

    if (activeSelection === 'Body') {
      ctx.strokeStyle = App.getTheme().ray3;
      ctx.lineWidth = 4;
      ctx.stroke();
    }

    ctx.restore();
  }

  function draw() {
    var TH = App.getTheme();
    
    ctx.fillStyle = '#f8fafc'; // 浅色背景
    ctx.fillRect(0, 0, cssW, cssH);

    var hC = w2s(layout.heartX, layout.heartY);
    var lC = w2s(layout.lungX, layout.lungY);
    var bC = w2s(layout.bodyX, layout.bodyY);
    
    // 绘制所有血管 (背景)
    drawPath(paths.venaCava, COLOR_DEOXY, 10);
    drawPath(paths.pulmonaryArtery, COLOR_DEOXY, 8);
    drawPath(paths.pulmonaryVein, COLOR_OXY, 8);
    drawPath(paths.aorta, COLOR_OXY, 10);
    
    // 内部短路径
    drawPath(paths.rightVentricle, COLOR_DEOXY, 12);
    drawPath(paths.leftVentricle, COLOR_OXY, 12);

    // 绘制血管标签
    if (showLabel) {
      ctx.fillStyle = '#475569';
      ctx.font = '10px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      
      var vcMid = w2s(80, 135);
      ctx.fillText('上/下腔静脉', vcMid[0], vcMid[1] + 20);
      
      var paMid = w2s(-80, -15);
      ctx.fillText('肺动脉', paMid[0], paMid[1] - 12);
      
      var pvMid = w2s(-60, -130);
      ctx.fillText('肺静脉', pvMid[0], pvMid[1] - 12);
      
      var aoMid = w2s(100, 40);
      ctx.fillText('主动脉', aoMid[0] + 30, aoMid[1]);
    }

    // 绘制器官
    drawLung();
    drawBody();
    drawHeart();

    // 绘制粒子
    if (showFlow) {
      for (var i = 0; i < particles.length; i++) {
        var p = particles[i];
        var path = paths[p.pathKey];
        if (!path) continue;
        
        var pt = getPointOnPath(path, p.progress);
        var sp = w2s(pt.x, pt.y);
        
        ctx.beginPath();
        ctx.arc(sp[0], sp[1], 3.5 * view.scale, 0, TAU);
        ctx.fillStyle = p.oxy ? COLOR_OXY : COLOR_DEOXY;
        ctx.fill();
        
        // 小高光
        ctx.beginPath();
        ctx.arc(sp[0] - 1 * view.scale, sp[1] - 1 * view.scale, 1 * view.scale, 0, TAU);
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        ctx.fill();
      }
    }

    // 循环路径大箭头指示
    if (activeSelection === 'systemic') {
      ctx.strokeStyle = App.getTheme().ray2;
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 6]);
      // 画一个大圈表示体循环：左心室 -> 主动脉 -> 全身 -> 腔静脉 -> 右心房
      var p1 = w2s(25, 40);
      var p2 = w2s(200, 150);
      var p3 = w2s(-25, -10);
      ctx.beginPath();
      ctx.moveTo(p1[0], p1[1]);
      ctx.quadraticCurveTo(p2[0], p2[1], p3[0], p3[1]);
      ctx.stroke();
      ctx.setLineDash([]);
    } else if (activeSelection === 'pulmonary') {
      ctx.strokeStyle = App.getTheme().ray3;
      ctx.lineWidth = 4;
      ctx.setLineDash([8, 6]);
      // 画一个大圈表示肺循环：右心室 -> 肺动脉 -> 肺 -> 肺静脉 -> 左心房
      var p1 = w2s(-25, 40);
      var p2 = w2s(-200, -80);
      var p3 = w2s(25, -10);
      ctx.beginPath();
      ctx.moveTo(p1[0], p1[1]);
      ctx.quadraticCurveTo(p2[0], p2[1], p3[0], p3[1]);
      ctx.stroke();
      ctx.setLineDash([]);
    }
  }

  // =============== 交互与读数 ===============
  var INFO = {
    RA: { title: '右心房', desc: '接收来自全身的缺氧血（静脉血）。' },
    RV: { title: '右心室', desc: '将缺氧血泵入肺动脉，送往肺部进行气体交换（肺循环的起点）。' },
    LA: { title: '左心房', desc: '接收来自肺部富含氧气的血液（动脉血）。' },
    LV: { title: '左心室', desc: '心脏最厚实的腔室，将富氧血泵入主动脉，送往全身（体循环的起点）。' },
    Lung: { title: '肺部毛细血管', desc: '血液在此释放二氧化碳，吸收氧气。血液由暗红色的静脉血变为鲜红色的动脉血。' },
    Body: { title: '全身毛细血管', desc: '血液在此把氧气和营养物质交给组织细胞，同时带走二氧化碳。血液由鲜红变为暗红。' },
    systemic: { title: '体循环路径', desc: '左心室 → 主动脉 → 各级动脉 → 全身毛细血管 → 各级静脉 → 上下腔静脉 → 右心房。' },
    pulmonary: { title: '肺循环路径', desc: '右心室 → 肺动脉 → 肺部毛细血管 → 肺静脉 → 左心房。' }
  };

  function showInfo(key) {
    var el = document.getElementById('readout');
    var info = INFO[key];
    if (info) {
      el.innerHTML = '<b>' + info.title + '</b><br>' + info.desc;
    } else {
      el.innerHTML = '点击画布中的心脏腔室或器官<br>可以查看详细说明';
    }
  }

  // 碰撞检测
  function hitTest(px, py) {
    // 检查心脏腔室
    var hCenter = w2s(layout.heartX, layout.heartY);
    var dx = px - hCenter[0];
    var dy = py - hCenter[1];
    
    var chambers = [
      { id: 'RA', x: -25, y: -10, r: 25 },
      { id: 'RV', x: -25, y: 40, r: 30 },
      { id: 'LA', x: 25, y: -10, r: 25 },
      { id: 'LV', x: 25, y: 40, r: 30 }
    ];
    
    for (var i = 0; i < chambers.length; i++) {
      var c = chambers[i];
      var cx = c.x * view.scale;
      var cy = c.y * view.scale;
      if (Math.hypot(dx - cx, dy - cy) < c.r * view.scale) {
        return c.id;
      }
    }

    // 检查肺
    var lCenter = w2s(layout.lungX, layout.lungY);
    if (Math.hypot(px - lCenter[0], py - lCenter[1]) < 60 * view.scale) return 'Lung';

    // 检查全身组织
    var bCenter = w2s(layout.bodyX, layout.bodyY);
    if (Math.hypot(px - bCenter[0], py - bCenter[1]) < 45 * view.scale) return 'Body';

    return null;
  }

  // 表格点击
  var trs = document.querySelectorAll('#caseTable tbody tr');
  for (var ti = 0; ti < trs.length; ti++) {
    (function(tr) {
      tr.addEventListener('click', function() {
        var id = tr.getAttribute('data-id');
        activeSelection = id;
        showInfo(id);
        
        // 高亮表格
        for(var i=0; i<trs.length; i++) trs[i].classList.remove('active');
        tr.classList.add('active');
      });
    })(trs[ti]);
  }

  var pointerState = { active: false, id: null, startX: 0, startY: 0, startCx: 0, startCy: 0, moved: false };
  var pinchState = null;
  var pointers = {};

  canvas.addEventListener('pointerdown', function(e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (Object.keys(pointers).length === 1) {
      var rect = canvas.getBoundingClientRect();
      pointerState.active = true;
      pointerState.id = e.pointerId;
      pointerState.startX = e.clientX - rect.left;
      pointerState.startY = e.clientY - rect.top;
      pointerState.startCx = targetView.cx;
      pointerState.startCy = targetView.cy;
      pointerState.moved = false;
    } else if (Object.keys(pointers).length === 2) {
      pinchState = null;
      updatePinch();
      pointerState.active = false;
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (Object.keys(pointers).length >= 2) {
      updatePinch();
      return;
    }

    if (!pointerState.active || e.pointerId !== pointerState.id) return;

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - pointerState.startX;
    var dy = py - pointerState.startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      pointerState.moved = true;
      targetView.cx = pointerState.startCx - dx / view.scale;
      targetView.cy = pointerState.startCy - dy / view.scale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
    }
  });

  function updatePinch() {
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (dist < 1) return;

    if (!pinchState) {
      var rect = canvas.getBoundingClientRect();
      var midX = (p1.x + p2.x) / 2 - rect.left;
      var midY = (p1.y + p2.y) / 2 - rect.top;
      pinchState = {
        dist: dist,
        scale: targetView.scale,
        midX: midX,
        midY: midY,
        worldX: (midX - cssW / 2) / view.scale + view.cx,
        worldY: (midY - cssH / 2) / view.scale + view.cy
      };
    } else {
      var ratio = dist / pinchState.dist;
      var newScale = pinchState.scale * ratio;
      newScale = Math.max(0.4, Math.min(3.0, newScale));
      
      targetView.scale = newScale;
      targetView.cx = pinchState.worldX - (pinchState.midX - cssW / 2) / newScale;
      targetView.cy = pinchState.worldY - (pinchState.midY - cssH / 2) / newScale;

      view.scale = newScale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;

      document.getElementById('zoomRange').value = newScale;
      document.getElementById('zoomVal').textContent = newScale.toFixed(1);
    }
  }

  function endPointer(e) {
    if (pointerState.active && e.pointerId === pointerState.id && !pointerState.moved) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left;
      var py = e.clientY - rect.top;
      
      var hit = hitTest(px, py);
      activeSelection = hit;
      
      if (hit) {
        showInfo(hit);
        // 如果选中了循环，更新表格高亮
        for(var i=0; i<trs.length; i++) {
          trs[i].classList.toggle('active', trs[i].getAttribute('data-id') === hit);
        }
      } else {
        showInfo(null);
        for(var i=0; i<trs.length; i++) trs[i].classList.remove('active');
      }
    }

    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchState = null;
    if (Object.keys(pointers).length === 0) pointerState.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  // =============== 侧栏 ===============
  document.getElementById('bpmRange').addEventListener('input', function(e) {
    bpm = parseInt(e.target.value, 10);
    document.getElementById('bpmVal').textContent = bpm;
  });

  document.getElementById('labelToggle').addEventListener('change', function(e) { showLabel = e.target.checked; });
  document.getElementById('valveToggle').addEventListener('change', function(e) { showValve = e.target.checked; });
  document.getElementById('flowToggle').addEventListener('change', function(e) { showFlow = e.target.checked; });

  var playBtn = document.getElementById('playBtn');
  playBtn.addEventListener('click', function() {
    playing = !playing;
    playBtn.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  });

  document.getElementById('resetBtn').addEventListener('click', function() {
    bpm = 75;
    playing = true;
    document.getElementById('bpmRange').value = 75;
    document.getElementById('bpmVal').textContent = '75';
    playBtn.textContent = '⏸ 暂停';
    activeSelection = null;
    for(var i=0; i<trs.length; i++) trs[i].classList.remove('active');
    showInfo(null);
    
    view.cx = 0; view.cy = 50; view.scale = 1;
    targetView.cx = 0; targetView.cy = 50; targetView.scale = 1;
    initParticles();
  });

  // =============== 主循环 ===============
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;

    // 心脏跳动节奏
    if (playing) {
      beatPhase += dt * (bpm / 60);
    }
    
    // 平滑相机
    view.cx += (targetView.cx - view.cx) * 0.1;
    view.cy += (targetView.cy - view.cy) * 0.1;
    view.scale += (targetView.scale - view.scale) * 0.1;

    if (!isFinite(view.cx)) view.cx = 0;
    if (!isFinite(view.cy)) view.cy = 50;
    if (!isFinite(view.scale) || view.scale <= 0) view.scale = 1;

    updateParticles(dt);
    draw();
  }

  resize();
  view.cx = 0; view.cy = 50; view.scale = 1;
  targetView.cx = 0; targetView.cy = 50; targetView.scale = 1;
  
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
