<meta charset="UTF-8">

<title>动植物分类系统 · 初中科学动态实验室</title>
<link rel="stylesheet" href="../shared/style.css">
<style>
  #readout b { color: #3b82f6; }
  .stage canvas { touch-action: none; }
  .lab-main { display: flex; flex-direction: column; }
  .stage { flex: 1; min-height: 0; position: relative; }
  
  /* 隐藏的 HTML 表格，用于导出或作为备用视图，但这里我们主要用 Canvas 渲染表格 */
  #tableContainer {
    display: none;
    width: 100%;
    height: 100%;
    overflow: auto;
    background: #fff;
    padding: 20px;
    box-sizing: border-box;
  }
  .taxonomy-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .taxonomy-table th, .taxonomy-table td {
    border: 1px solid #e2e8f0;
    padding: 10px 12px;
    text-align: center;
  }
  .taxonomy-table th {
    background: #f8fafc;
    color: #1e293b;
    font-weight: bold;
    position: sticky;
    top: 0;
  }
  .taxonomy-table tr:nth-child(even) { background: #f1f5f9; }
  .taxonomy-table tr:hover { background: #e0f2fe; }
  .taxonomy-table .highlight { background: #fef08a; font-weight: bold; }

  /* 控制面板按钮组 */

    margin-bottom: 12px;

  .view-toggle button {

    border: 1px solid #cbd5e1;

    font-size: 13px;

    color: #fff;

    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 10px;
  }
  .specimen-btn {
    padding: 4px 8px;
    font-size: 12px;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    background: #f8fafc;
    cursor: pointer;
  }
  .specimen-btn:hover { background: #e2e8f0; }
  .specimen-btn.active { background: #10b981; color: #fff; border-color: #10b981; }

  .nav-hint {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 12px;
  }
</style>
</head>

<h1>动植物分类系统</h1>

<div class="lab">
<aside class="lab-side">
  <table class="case-table" id="caseTable">
    <thead><tr><th>层级</th><th>名称</th></tr></thead>

      <tr><td>界</td><td>—</td></tr>
      <tr><td>门</td><td>—</td></tr>
      <tr><td>纲</td><td>—</td></tr>
      <tr><td>目</td><td>—</td></tr>
      <tr><td>科</td><td>—</td></tr>
      <tr><td>属</td><td>—</td></tr>
      <tr><td>种</td><td>—</td></tr>
    </tbody>
  </table>

  <h3>控制面板</h3>

  <div class="view-toggle">
    <button id="btnMindmap" class="active">思维导图</button>
    <button id="btnTable">数据表格</button>
  </div>

  <div class="row">

    <select id="rangeSelect" style="margin-left:auto;">

            <th>界</th><th>门</th><th>纲</th><th>目</th><th>科</th><th>属</th><th>种 (代表生物)</th>

<script src="../shared/common.js"></script>
<script>
(function(){
  if (window.App) App.injectTopbar();

  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var TAU = Math.PI * 2;

  var cssW = 800, cssH = 500, dpr = 1;
  var view = { cx: 0, cy: 0, scale: 1 };
  var targetView = { cx: 0, cy: 0, scale: 1 };

  var viewMode = 'mindmap'; // 'mindmap' | 'table'
  var rangeMode = 'junior'; // 'junior' | 'full'
  var activeSpecimenId = null;

  // 节点点击状态
  var hoveredNode = null;

  // ==========================================
  // 1. 数据构建
  // ==========================================
  // 每个物种代表一条从“界”到“种”的完整路径
  var SPECIMENS = [
    // 植物界
    { id: 'spirulina', name: '螺旋藻', kingdom: '植物界', phylum: '蓝藻门', class: '蓝藻纲', order: '颤藻目', family: '颤藻科', genus: '螺旋藻属', species: '螺旋藻', type: '藻类植物', junior: true },
    { id: 'funaria', name: '葫芦藓', kingdom: '植物界', phylum: '苔藓植物门', class: '藓纲', order: '葫芦藓目', family: '葫芦藓科', genus: '葫芦藓属', species: '葫芦藓', type: '苔藓植物', junior: true },
    { id: 'fern', name: '肾蕨', kingdom: '植物界', phylum: '蕨类植物门', class: '蕨纲', order: '水龙骨目', family: '肾蕨科', genus: '肾蕨属', species: '肾蕨', type: '蕨类植物', junior: true },
    { id: 'ginkgo', name: '银杏', kingdom: '植物界', phylum: '裸子植物门', class: '银杏纲', order: '银杏目', family: '银杏科', genus: '银杏属', species: '银杏', type: '裸子植物', junior: true },
    { id: 'peach', name: '桃树', kingdom: '植物界', phylum: '被子植物门', class: '双子叶植物纲', order: '蔷薇目', family: '蔷薇科', genus: '李属', species: '桃', type: '被子植物', junior: true },
    { id: 'corn', name: '玉米', kingdom: '植物界', phylum: '被子植物门', class: '单子叶植物纲', order: '禾本目', family: '禾本科', genus: '玉蜀黍属', species: '玉米', type: '被子植物', junior: true },
    
    // 动物界 - 无脊椎
    { id: 'hydra', name: '水螅', kingdom: '动物界', phylum: '刺胞动物门(腔肠)', class: '水螅纲', order: '水螅目', family: '水螅科', genus: '水螅属', species: '水螅', type: '腔肠动物', junior: true },
    { id: 'planaria', name: '涡虫', kingdom: '动物界', phylum: '扁形动物门', class: '涡虫纲', order: '三肠目', family: '涡虫科', genus: '涡虫属', species: '涡虫', type: '扁形动物', junior: true },
    { id: 'ascaris', name: '蛔虫', kingdom: '动物界', phylum: '线形动物门', class: '线虫纲', order: '蛔目', family: '蛔科', genus: '蛔属', species: '蛔虫', type: '线形动物', junior: true },
    { id: 'earthworm', name: '蚯蚓', kingdom: '动物界', phylum: '环节动物门', class: '寡毛纲', order: '后孔寡毛目', family: '巨蚓科', genus: '环毛蚓属', species: '蚯蚓', type: '环节动物', junior: true },
    { id: 'snail', name: '蜗牛', kingdom: '动物界', phylum: '软体动物门', class: '腹足纲', order: '柄眼目', family: '大蜗牛科', genus: '蜗牛属', species: '蜗牛', type: '软体动物', junior: true },
    { id: 'locust', name: '蝗虫', kingdom: '动物界', phylum: '节肢动物门', class: '昆虫纲', order: '直翅目', family: '蝗科', genus: '飞蝗属', species: '东亚飞蝗', type: '节肢动物', junior: true },
    { id: 'starfish', name: '海星', kingdom: '动物界', phylum: '棘皮动物门', class: '海星纲', order: '钳棘目', family: '海盘车科', genus: '海盘车属', species: '海星', type: '棘皮动物', junior: true },
    
    // 动物界 - 脊椎
    { id: 'shark', name: '鲨鱼', kingdom: '动物界', phylum: '脊索动物门', class: '软骨鱼纲', order: '真鲨目', family: '真鲨科', genus: '真鲨属', species: '鲨鱼', type: '鱼类', junior: true },
    { id: 'frog', name: '青蛙', kingdom: '动物界', phylum: '脊索动物门', class: '两栖纲', order: '无尾目', family: '蛙科', genus: '侧褶蛙属', species: '黑斑侧褶蛙', type: '两栖类', junior: true },
    { id: 'turtle', name: '乌龟', kingdom: '动物界', phylum: '脊索动物门', class: '爬行纲', order: '龟鳖目', family: '龟科', genus: '乌龟属', species: '乌龟', type: '爬行类', junior: true },
    { id: 'sparrow', name: '麻雀', kingdom: '动物界', phylum: '脊索动物门', class: '鸟纲', order: '雀形目', family: '麻雀科', genus: '麻雀属', species: '树麻雀', type: '鸟类', junior: true },
    { id: 'panda', name: '大熊猫', kingdom: '动物界', phylum: '脊索动物门', class: '哺乳纲', order: '食肉目', family: '熊科', genus: '大熊猫属', species: '大熊猫', type: '哺乳类', junior: true },
    { id: 'human', name: '人类', kingdom: '动物界', phylum: '脊索动物门', class: '哺乳纲', order: '灵长目', family: '人科', genus: '人属', species: '智人', type: '哺乳类', junior: true }
  ];

  // 渲染分类树
  var treeData = null;
  
  function buildTree() {
    var root = { name: '生物', children: [], expanded: true };
    
    // 构建层级: 界 -> 门 -> 纲 -> 目 -> 科 -> 属 -> 种
    SPECIMENS.forEach(function(sp) {
      // 如果是初中考点模式，跳过不属于初中考点的物种
      if (rangeMode === 'junior' && !sp.junior) return;

      var levels = ['kingdom', 'phylum', 'class', 'order', 'family', 'genus', 'species'];
      var names = [sp.kingdom, sp.phylum, sp.class, sp.order, sp.family, sp.genus, sp.species];
      
      var current = root;
      for (var i = 0; i < levels.length; i++) {
        var levelName = names[i];
        if (!levelName) continue;

        var found = null;
        for (var j = 0; j < current.children.length; j++) {
          if (current.children[j].name === levelName) {
            found = current.children[j];
            break;
          }
        }
        
        if (!found) {
          found = { 
            name: levelName, 
            children: [], 
            level: levels[i],
            specimen: (i === levels.length - 1) ? sp : null
          };
          current.children.push(found);
        }
        current = found;
      }
    });
    return root;
  }

  // ==========================================
  // 2. 视图与渲染逻辑
  // ==========================================
  
  // 表格渲染
  function renderTable() {
    var tbody = document.getElementById('taxTbody');
    tbody.innerHTML = '';
    
    var filtered = SPECIMENS.filter(function(sp) {
      return rangeMode === 'full' || (rangeMode === 'junior' && sp.junior);
    });
    
    filtered.forEach(function(sp) {
      var tr = document.createElement('tr');
      if (activeSpecimenId === sp.id) tr.className = 'highlight';
      tr.innerHTML = `
        <td>${sp.kingdom}</td>
        <td>${sp.phylum}</td>
        <td>${sp.class}</td>
        <td>${sp.order}</td>
        <td>${sp.family}</td>
        <td>${sp.genus}</td>
        <td><b>${sp.species}</b><br><span style="font-size:11px;color:#64748b">(${sp.name})</span></td>
      `;
      tr.addEventListener('click', function() {
        selectSpecimen(sp.id);
      });
      tbody.appendChild(tr);
    });
  }

  // 思维导图渲染 (Canvas)
  var treeNodes = [];
  var treeLinks = [];
  var NODE_W = 100;
  var NODE_H = 30;
  var X_GAP = 160;
  var Y_GAP = 16;

  function calcTreeLayout() {
    treeData = buildTree();
    treeNodes = [];
    treeLinks = [];

    var levelWidths = {};
    var maxDepth = 0;

    function measure(node, depth) {
      node.depth = depth;
      maxDepth = Math.max(maxDepth, depth);
      if (node.children.length === 0) {
        node.h = NODE_H + Y_GAP;
      } else {
        var sumH = 0;
        node.children.forEach(function(child) {
          sumH += measure(child, depth + 1);
        });
        node.h = sumH;
      }
      return node.h;
    }

    function position(node, x, yTop) {
      node.x = x;
      node.y = yTop + node.h / 2;
      treeNodes.push(node);

      var currentY = yTop;
      node.children.forEach(function(child) {
        position(child, x + X_GAP, currentY);
        currentY += child.h;
        
        treeLinks.push({
          source: node,
          target: child
        });
      });
    }

    measure(treeData, 0);
    
    // 确保“门”这一级对齐等
    position(treeData, 0, 0);
    
    // 调整整体位置使导图居中
    var totalH = treeData.h;
    var totalW = maxDepth * X_GAP;
    
    treeNodes.forEach(function(node) {
      node.drawX = node.x - totalW / 2;
      node.drawY = node.y - totalH / 2;
    });

    if (viewMode === 'mindmap' && treeData.children.length > 0) {
      // 自动适应屏幕
      var scaleX = (cssW * 0.85) / (totalW + NODE_W);
      var scaleY = (cssH * 0.85) / totalH;
      targetView.scale = Math.min(scaleX, scaleY, 1.2);
      targetView.cx = 0;
      targetView.cy = 0;
    }
  }

  function resize() {
    var rect = canvas.getBoundingClientRect();
    if (rect.width < 10 || rect.height < 10) return;
    cssW = rect.width;
    cssH = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    calcTreeLayout();
  }

  if (window.ResizeObserver) {
    try { new ResizeObserver(resize).observe(canvas); } catch (e) {}
  }
  window.addEventListener('resize', resize);

  function w2s(x, y) {
    return [cssW / 2 + (x - view.cx) * view.scale, cssH / 2 + (y - view.cy) * view.scale];
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawMindmap() {
    var TH = App.getTheme();
    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(0, 0, cssW, cssH);

    ctx.save();
    
    // 绘制连线
    treeLinks.forEach(function(link) {
      var sp = w2s(link.source.drawX + NODE_W, link.source.drawY);
      var tp = w2s(link.target.drawX, link.target.drawY);
      
      ctx.beginPath();
      ctx.moveTo(sp[0], sp[1]);
      
      // 贝塞尔曲线
      var cpX = (sp[0] + tp[0]) / 2;
      ctx.bezierCurveTo(cpX, sp[1], cpX, tp[1], tp[0], tp[1]);
      
      // 高亮路径
      var isHighlight = false;
      if (activeSpecimenId) {
        var spObj = SPECIMENS.find(function(s) { return s.id === activeSpecimenId; });
        // 简单判断：如果当前连线属于该物种路径，则高亮（此处简化处理，不作复杂路径追踪）
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
      } else {
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
      }
      
      ctx.lineWidth = 2 * view.scale;
      ctx.stroke();
    });

    // 绘制节点
    treeNodes.forEach(function(node) {
      var pos = w2s(node.drawX, node.drawY);
      
      var w = NODE_W * view.scale;
      var h = NODE_H * view.scale;
      
      var isSelected = (activeSpecimenId && node.specimen && node.specimen.id === activeSpecimenId);
      var isHover = (hoveredNode === node);
      
      ctx.save();
      ctx.translate(pos[0], pos[1]);
      
      // 节点样式
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1.5 * view.scale;
      
      if (isSelected) {
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#047857';
      } else if (isHover) {
        ctx.fillStyle = '#f1f5f9';
        ctx.strokeStyle = '#3b82f6';
      } else if (node.level === 'kingdom') {
        ctx.fillStyle = '#e0f2fe';
        ctx.strokeStyle = '#7dd3fc';
      } else if (node.level === 'phylum') {
        ctx.fillStyle = '#ecfccb';
        ctx.strokeStyle = '#bef264';
      }
      
      roundRect(-w/2, -h/2, w, h, 6 * view.scale);
      ctx.fill();
      ctx.stroke();

      // 文字
      ctx.fillStyle = isSelected ? '#fff' : '#334155';
      ctx.font = 'bold ' + (12 * view.scale) + 'px "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      
      var text = node.name;
      if (text.length > 7 && view.scale < 1) {
         // 文字过长截断
         text = text.substring(0, 6) + '...';
      }
      ctx.fillText(text, 0, 0);
      
      ctx.restore();
    });

    ctx.restore();
  }

  // ==========================================
  // 3. 交互逻辑
  // ==========================================

  // 左侧侧栏联动
  function selectSpecimen(id) {
    activeSpecimenId = id;
    var sp = SPECIMENS.find(function(s) { return s.id === id; });
    if (!sp) return;

    // 更新表格数据
    var trs = document.querySelectorAll('#pathTable tr');
    trs[0].children[1].textContent = sp.kingdom || '—';
    trs[1].children[1].textContent = sp.phylum || '—';
    trs[2].children[1].textContent = sp.class || '—';
    trs[3].children[1].textContent = sp.order || '—';
    trs[4].children[1].textContent = sp.family || '—';
    trs[5].children[1].textContent = sp.genus || '—';
    trs[6].children[1].innerHTML = '<b>' + (sp.species || '—') + '</b> <span style="color:#64748b">(' + sp.name + ')</span>';

    // 更新按钮高亮
    var btns = document.querySelectorAll('.specimen-btn');
    btns.forEach(function(btn) {
      btn.classList.toggle('active', btn.getAttribute('data-id') === id);
    });

    // 如果当前是表格模式，重绘表格
    if (viewMode === 'table') {
      renderTable();
    }

    document.getElementById('readout').innerHTML = '当前物种：<b>' + sp.name + '</b><br>属于 ' + (sp.type || '未知类群');
  }

  // 渲染物种按钮
  function renderSpecimenBtns() {
    var box = document.getElementById('specimenList');
    box.innerHTML = '';
    var filtered = SPECIMENS.filter(function(sp) {
      return rangeMode === 'full' || (rangeMode === 'junior' && sp.junior);
    });
    filtered.forEach(function(sp) {
      var btn = document.createElement('div');
      btn.className = 'specimen-btn';
      if (activeSpecimenId === sp.id) btn.classList.add('active');
      btn.textContent = sp.name;
      btn.setAttribute('data-id', sp.id);
      btn.addEventListener('click', function() {
        selectSpecimen(sp.id);
      });
      box.appendChild(btn);
    });
  }

  // 切换模式
  function updateView() {
    document.getElementById('btnMindmap').classList.toggle('active', viewMode === 'mindmap');
    document.getElementById('btnTable').classList.toggle('active', viewMode === 'table');

    if (viewMode === 'mindmap') {
      canvas.style.display = 'block';
      document.getElementById('tableContainer').style.display = 'none';
      calcTreeLayout(); // 重新计算居中
    } else {
      canvas.style.display = 'none';
      document.getElementById('tableContainer').style.display = 'block';
      renderTable();
    }
  }

  document.getElementById('btnMindmap').addEventListener('click', function() {
    viewMode = 'mindmap';
    updateView();
  });

  document.getElementById('btnTable').addEventListener('click', function() {
    viewMode = 'table';
    updateView();
  });

  document.getElementById('rangeSelect').addEventListener('change', function(e) {
    rangeMode = e.target.value;
    // 清空选中状态，因为数据可能变了
    activeSpecimenId = null;
    document.getElementById('pathTable').innerHTML = `
      <tr><td>界</td><td>—</td></tr><tr><td>门</td><td>—</td></tr>
      <tr><td>纲</td><td>—</td></tr><tr><td>目</td><td>—</td></tr>
      <tr><td>科</td><td>—</td></tr><tr><td>属</td><td>—</td></tr><tr><td>种</td><td>—</td></tr>
    `;
    renderSpecimenBtns();
    calcTreeLayout();
    updateView();
    document.getElementById('readout').innerHTML = '点击画布中的节点或上方物种<br>查看其完整的分类学归属。';
  });

  // 鼠标 / 触摸交互 (仅对 Canvas)
  var pointerState = { active: false, id: null, startX: 0, startY: 0, startCx: 0, startCy: 0, moved: false };
  var pinchState = null;
  var pointers = {};

  canvas.addEventListener('pointerdown', function(e) {
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (Object.keys(pointers).length === 1) {
      var rect = canvas.getBoundingClientRect();
      pointerState.active = true;
      pointerState.id = e.pointerId;
      pointerState.startX = e.clientX - rect.left;
      pointerState.startY = e.clientY - rect.top;
      pointerState.startCx = targetView.cx;
      pointerState.startCy = targetView.cy;
      pointerState.moved = false;
    } else if (Object.keys(pointers).length === 2) {
      pinchState = null;
      updatePinch();
      pointerState.active = false;
    }
  });

  canvas.addEventListener('pointermove', function(e) {
    if (!pointers[e.pointerId]) return;
    pointers[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (Object.keys(pointers).length >= 2) {
      updatePinch();
      return;
    }

    if (!pointerState.active || e.pointerId !== pointerState.id) return;

    var rect = canvas.getBoundingClientRect();
    var px = e.clientX - rect.left;
    var py = e.clientY - rect.top;
    var dx = px - pointerState.startX;
    var dy = py - pointerState.startY;

    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
      pointerState.moved = true;
      targetView.cx = pointerState.startCx - dx / view.scale;
      targetView.cy = pointerState.startCy - dy / view.scale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
    } else {
      // 悬浮检测
      var mx = (px - cssW / 2) / view.scale + view.cx;
      var my = (py - cssH / 2) / view.scale + view.cy;
      
      var hoverNode = null;
      for (var i = 0; i < treeNodes.length; i++) {
        var node = treeNodes[i];
        if (mx >= node.drawX - NODE_W/2 && mx <= node.drawX + NODE_W/2 &&
            my >= node.drawY - NODE_H/2 && my <= node.drawY + NODE_H/2) {
          hoverNode = node;
          break;
        }
      }
      
      if (hoveredNode !== hoverNode) {
        hoveredNode = hoverNode;
        canvas.style.cursor = hoveredNode ? 'pointer' : 'default';
      }
    }
  });

  function updatePinch() {
    var ids = Object.keys(pointers);
    if (ids.length !== 2) return;
    var p1 = pointers[ids[0]], p2 = pointers[ids[1]];
    var dist = Math.hypot(p1.x - p2.x, p1.y - p2.y);
    if (dist < 1) return;

    if (!pinchState) {
      var rect = canvas.getBoundingClientRect();
      var midX = (p1.x + p2.x) / 2 - rect.left;
      var midY = (p1.y + p2.y) / 2 - rect.top;
      pinchState = {
        dist: dist,
        scale: targetView.scale,
        midX: midX,
        midY: midY,
        worldX: (midX - cssW / 2) / view.scale + view.cx,
        worldY: (midY - cssH / 2) / view.scale + view.cy
      };
    } else {
      var ratio = dist / pinchState.dist;
      var newScale = pinchState.scale * ratio;
      newScale = Math.max(0.2, Math.min(3.0, newScale));
      
      targetView.scale = newScale;
      targetView.cx = pinchState.worldX - (pinchState.midX - cssW / 2) / newScale;
      targetView.cy = pinchState.worldY - (pinchState.midY - cssH / 2) / newScale;

      view.scale = newScale;
      view.cx = targetView.cx;
      view.cy = targetView.cy;
    }
  }

  function endPointer(e) {
    if (pointerState.active && e.pointerId === pointerState.id && !pointerState.moved) {
      var rect = canvas.getBoundingClientRect();
      var px = e.clientX - rect.left;
      var py = e.clientY - rect.top;
      
      var mx = (px - cssW / 2) / view.scale + view.cx;
      var my = (py - cssH / 2) / view.scale + view.cy;
      
      // 检测点击
      for (var i = 0; i < treeNodes.length; i++) {
        var node = treeNodes[i];
        if (mx >= node.drawX - NODE_W/2 && mx <= node.drawX + NODE_W/2 &&
            my >= node.drawY - NODE_H/2 && my <= node.drawY + NODE_H/2) {
          
          if (node.specimen) {
             // 是具体的物种节点
             selectSpecimen(node.specimen.id);
          } else {
             // 是分类层级节点，寻找其下的任意一个物种进行路径展示
             var foundSp = findSpecimenInNode(node);
             if (foundSp) {
               selectSpecimen(foundSp.id);
             }
          }
          break;
        }
      }
    }

    delete pointers[e.pointerId];
    if (Object.keys(pointers).length < 2) pinchState = null;
    if (Object.keys(pointers).length === 0) pointerState.active = false;
    try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  function findSpecimenInNode(node) {
    if (node.specimen) return node.specimen;
    for (var i = 0; i < node.children.length; i++) {
      var found = findSpecimenInNode(node.children[i]);
      if (found) return found;
    }
    return null;
  }

  // =============== 主循环 ===============
  var lastT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    if (cssW < 10) resize();
    if (viewMode === 'table') return; // 表格模式不使用 canvas 渲染

    if (!lastT) lastT = now;
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.08) dt = 0.08;

    view.cx += (targetView.cx - view.cx) * 0.1;
    view.cy += (targetView.cy - view.cy) * 0.1;
    view.scale += (targetView.scale - view.scale) * 0.1;

    if (!isFinite(view.cx)) view.cx = 0;
    if (!isFinite(view.cy)) view.cy = 0;
    if (!isFinite(view.scale) || view.scale <= 0) view.scale = 1;

    drawMindmap();
  }

  // =============== 启动 ===============
  resize();
  renderSpecimenBtns();
  updateView();
  requestAnimationFrame(frame);

})();
</script>
</body>
</html>
